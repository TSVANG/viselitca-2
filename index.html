<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Виселица - Бумажная Версия</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Рукописный шрифт для стиля фломастера -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none;
            touch-action: manipulation; position: fixed; width: 100%;
        }
        
        /* Бумажный фон в линеечку */
        .paper-bg {
            background-color: #fdf6e3;
            background-image: repeating-linear-gradient(transparent, transparent 31px, #cbd5e1 31px, #cbd5e1 32px);
            font-family: 'Caveat', cursive;
        }

        /* Стиль нарисованных от руки элементов */
        .drawn-box {
            border: 3px solid #1e293b;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background: #fff;
            box-shadow: 4px 4px 0px rgba(30, 41, 59, 0.15);
        }
        
        .drawn-btn {
            border: 3px solid #1e293b;
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            background: transparent;
            box-shadow: 3px 4px 0px rgba(30, 41, 59, 0.2);
            transition: all 0.1s;
        }
        .drawn-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(30, 41, 59, 0.2);
        }

        /* Цвета "Фломастеров" для кнопок */
        .marker-green { border-color: #16a34a; color: #14532d; background: rgba(34, 197, 94, 0.15); }
        .marker-yellow { border-color: #ca8a04; color: #713f12; background: rgba(234, 179, 8, 0.15); }
        .marker-orange { border-color: #ea580c; color: #7c2d12; background: rgba(249, 115, 22, 0.15); }
        .marker-red { border-color: #dc2626; color: #7f1d1d; background: rgba(239, 68, 68, 0.15); }
        .marker-purple { border-color: #9333ea; color: #4c1d95; background: rgba(168, 85, 247, 0.15); }
        .marker-blue { border-color: #2563eb; color: #1e3a8a; background: rgba(59, 130, 246, 0.15); }

        /* Клавиатура */
        .key-btn {
            border: 2px solid #475569;
            border-radius: 8px 12px 10px 8px / 12px 8px 10px 12px;
            background: #fff;
            transition: all 0.1s;
        }
        .key-correct {
            border-color: #16a34a; background: rgba(34, 197, 94, 0.2); color: #14532d; font-weight: bold;
        }
        .key-wrong {
            border-color: #94a3b8; background: transparent; color: #94a3b8; text-decoration: line-through;
        }

        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s ease; }
        .hide { display: none !important; }
        .fade-in { animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .locked-level { filter: grayscale(100%); opacity: 0.6; pointer-events: none; }

        /* Анимация обучения */
        @keyframes tut-press {
            0%, 100% { transform: scale(1); background: #fff; }
            50% { transform: scale(0.85); background: #e2e8f0; }
        }
        .anim-press { animation: tut-press 0.5s ease-in-out; }

        /* --- ГЛОБАЛЬНАЯ АДАПТАЦИЯ ДЛЯ КРОШЕЧНЫХ ЭКРАНОВ (240x360) --- */
        @media (max-width: 320px), (max-height: 480px) {
            .text-6xl { font-size: 2.5rem !important; line-height: 1 !important; }
            .text-5xl { font-size: 2rem !important; line-height: 1.1 !important; }
            .text-4xl { font-size: 1.75rem !important; line-height: 1.1 !important; }
            .text-3xl { font-size: 1.5rem !important; }
            .text-2xl { font-size: 1.25rem !important; }
            .text-xl { font-size: 1.1rem !important; }
            .text-lg { font-size: 0.9rem !important; }

            .p-4 { padding: 0.5rem !important; }
            .p-6 { padding: 0.75rem !important; }
            .p-8 { padding: 1rem !important; }
            
            .gap-4 { gap: 0.5rem !important; }
            .gap-6 { gap: 0.5rem !important; }
            .mb-6 { margin-bottom: 0.75rem !important; }
            .mb-4 { margin-bottom: 0.5rem !important; }
            .mt-4 { margin-top: 0.5rem !important; }
            .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.35rem !important; }

            .drawn-box, .drawn-btn, .key-btn { border-width: 2px !important; }
            
            #hangman-container { 
                max-height: 25vh; 
                min-height: 80px; 
                max-width: 25vh; 
                margin: 0 auto; 
            }
            
            .key-btn { height: 1.8rem !important; width: 8.1% !important; font-size: 0.7rem !important; border-width: 1px !important; border-radius: 6px !important; }
            #keyboard > div { gap: 2px !important; }
            
            .action-btn { width: 2.75rem !important; height: 2.75rem !important; font-size: 1.25rem !important; }
            .action-btn span { font-size: 0.65rem !important; top: -5px !important; right: -5px !important; width: 1.25rem !important; height: 1.25rem !important; padding: 0 !important; border-width: 1px !important;}
            
            #main-menu-content { max-width: 95vw !important; width: 100% !important; }
            .menu-icon-btn { padding: 0.35rem !important; }
            .menu-icon-btn span { font-size: 1.5rem !important; }

            /* Компактный вид слов */
            .word-letter-container { height: 1.75rem !important; width: 1rem !important; margin-bottom: 0.25rem !important; border-bottom-width: 2px !important; margin-left: 2px !important; margin-right: 2px !important; }
            .word-letter { font-size: 1.25rem !important; padding-bottom: 0 !important; }
        }
    </style>
</head>
<body class="paper-bg flex flex-col items-center justify-center min-h-screen p-1 sm:p-2 text-slate-800" oncontextmenu="return false;">

    <!-- ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ (Toast) -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-2xl shadow-xl z-[100] opacity-0 pointer-events-none -translate-y-10 transition-all duration-300 font-bold text-lg sm:text-xl text-center min-w-[200px] border-2 border-slate-900 w-11/12 max-w-xs" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;"></div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="fixed inset-0 paper-bg z-40 flex flex-col items-center justify-center p-2 sm:p-4 overflow-y-auto">
        <div id="main-menu-content" class="w-full max-w-sm flex flex-col gap-3 sm:gap-4 fade-in my-auto">
            <!-- Статистика -->
            <div class="flex justify-between items-center drawn-box p-2 sm:p-3">
                <div class="flex items-center gap-1 sm:gap-2"><span class="text-xl sm:text-2xl">💰</span><span id="menu-coins" class="font-bold text-xl sm:text-2xl">0</span></div>
                <div class="flex items-center gap-1 sm:gap-2"><span class="text-xl sm:text-2xl">🏆</span><span id="menu-score" class="font-bold text-xl sm:text-2xl">0</span></div>
            </div>

            <h1 class="text-4xl sm:text-6xl font-bold text-center my-1 sm:my-2 tracking-tight text-slate-900" style="text-shadow: 2px 2px 0px rgba(0,0,0,0.1);">Виселица</h1>

            <!-- Кнопки уровней -->
            <div class="space-y-3 relative text-xl sm:text-2xl">
                <button data-level="easy" onclick="game.init('easy')" class="w-full drawn-btn marker-green font-bold py-1.5 sm:py-2 px-2 sm:px-4 text-center">Легкий</button>
                
                <button data-level="medium" id="btn-lvl-medium" data-name="Средний" class="w-full drawn-btn marker-yellow font-bold py-1.5 sm:py-2 px-2 sm:px-4 locked-level flex justify-between items-center">
                    <span>Средний</span><span class="text-base sm:text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-medium">🔒 0/10</span>
                </button>

                <button data-level="hard" id="btn-lvl-hard" data-name="Сложный" class="w-full drawn-btn marker-orange font-bold py-1.5 sm:py-2 px-2 sm:px-4 locked-level flex justify-between items-center">
                    <span>Сложный</span><span class="text-base sm:text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-hard">🔒 0/10</span>
                </button>

                <button data-level="impossible" id="btn-lvl-impossible" data-name="Невозможный" class="w-full drawn-btn marker-red font-bold py-1.5 sm:py-2 px-2 sm:px-4 locked-level flex justify-between items-center">
                    <span>Невозможный</span><span class="text-base sm:text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-impossible">🔒 0/10</span>
                </button>

                <button data-level="random" id="btn-lvl-random" data-name="Бог рандома" class="w-full drawn-btn marker-purple font-bold py-1.5 sm:py-2 px-2 sm:px-4 locked-level flex justify-between items-center">
                    <span>Бог рандома</span><span class="text-base sm:text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-random">🔒 0/10</span>
                </button>
            </div>

            <button id="btn-daily" class="w-full drawn-btn marker-blue font-bold py-1.5 sm:py-2 px-2 sm:px-4 text-xl sm:text-2xl flex items-center justify-center gap-2 mt-1">
                <span>🌟 Слово Дня</span>
            </button>

            <!-- Нижняя панель иконок -->
            <div class="grid grid-cols-3 gap-1 sm:gap-2 mt-1">
                <button onclick="shop.open()" class="menu-icon-btn drawn-btn bg-white p-1.5 sm:p-2 flex flex-col items-center justify-center"><span class="text-2xl sm:text-3xl">🛒</span></button>
                <button onclick="dict.open()" class="menu-icon-btn drawn-btn bg-white p-1.5 sm:p-2 flex flex-col items-center justify-center"><span class="text-2xl sm:text-3xl">📚</span></button>
                <button onclick="pvp.open()" class="menu-icon-btn drawn-btn bg-white p-1.5 sm:p-2 flex flex-col items-center justify-center"><span class="text-2xl sm:text-3xl">⚔️</span></button>
                <button onclick="ui.showLeaderboard()" class="menu-icon-btn drawn-btn bg-white p-1.5 sm:p-2 flex flex-col items-center justify-center"><span class="text-2xl sm:text-3xl">🏅</span></button>
                <button onclick="ui.shareApp()" class="menu-icon-btn drawn-btn bg-white p-1.5 sm:p-2 flex flex-col items-center justify-center"><span class="text-2xl sm:text-3xl">📤</span></button>
                <button onclick="ui.openSettings()" class="menu-icon-btn drawn-btn bg-white p-1.5 sm:p-2 flex flex-col items-center justify-center"><span class="text-2xl sm:text-3xl">⚙️</span></button>
            </div>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="app-container" class="w-full max-w-md mx-auto flex flex-col h-full transition-all duration-300 hide z-10 relative">
        <header class="flex justify-between items-center mb-1 flex-shrink-0 w-full pt-1 sm:pt-2">
            <button onclick="ui.goToMenu()" class="w-10 h-10 sm:w-12 sm:h-12 drawn-btn bg-white flex items-center justify-center text-2xl sm:text-3xl pb-1">⬅</button>
            <div class="text-lg sm:text-2xl font-bold bg-white border-2 border-slate-800 px-2 sm:px-4 py-0.5 rounded-xl text-slate-800 text-center flex-1 mx-2 overflow-hidden text-ellipsis whitespace-nowrap" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;" id="game-diff-label">УРОВЕНЬ</div>
            
            <div class="drawn-box px-2 sm:px-3 py-0.5 sm:py-1 flex items-center justify-center gap-1 bg-white">
                <span class="text-base sm:text-xl">💰</span>
                <span id="game-coins-show" class="font-bold text-base sm:text-xl text-slate-800">0</span>
            </div>
        </header>

        <main class="w-full flex flex-col items-center flex-grow justify-around min-h-0">
            <!-- Canvas теперь максимально гибкий -->
            <div id="hangman-container" class="w-full max-w-[240px] sm:max-w-xs aspect-square relative drawn-box bg-white/50 flex-shrink flex-grow-0"><canvas id="hangman-canvas" class="w-full h-full"></canvas></div>
            
            <div id="word-container" class="flex flex-wrap justify-center gap-x-0.5 gap-y-1 sm:gap-y-2 my-1 sm:my-2 text-2xl sm:text-4xl font-bold tracking-widest uppercase w-full"></div>
            
            <div id="keyboard" class="w-full flex flex-col items-center gap-1 sm:gap-2 mt-1 font-bold uppercase pb-2"></div>
            
            <div class="w-full flex justify-center gap-4 sm:gap-6 px-4 pb-2">
                <!-- Ластик -->
                <button id="btn-eraser" onclick="game.useEraser()" class="action-btn w-12 h-12 sm:w-16 sm:h-16 drawn-btn marker-red flex items-center justify-center text-2xl sm:text-3xl relative">
                    🧽
                    <span id="eraser-count" class="absolute -top-2 -right-2 bg-slate-800 text-white text-sm sm:text-lg px-1 sm:px-2 rounded-full border-2 border-white flex items-center justify-center min-w-[1.25rem] min-h-[1.25rem]">3</span>
                </button>
                <!-- Подсказка -->
                <button id="btn-hint" onclick="game.useHint()" class="action-btn w-12 h-12 sm:w-16 sm:h-16 drawn-btn marker-yellow flex items-center justify-center text-2xl sm:text-3xl relative">
                    💡
                    <span id="hint-count" class="absolute -top-2 -right-2 bg-slate-800 text-white text-sm sm:text-lg px-1 sm:px-2 rounded-full border-2 border-white flex items-center justify-center min-w-[1.25rem] min-h-[1.25rem]">3</span>
                </button>
            </div>
        </main>
    </div>

    <!-- МОДАЛКИ (адаптированные) -->

    <!-- Настройки -->
    <div id="modal-settings" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-2 sm:p-4 z-[60] hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box p-4 sm:p-8 text-center w-[95vw] sm:max-w-sm modal-content bg-[#fdf6e3] relative">
            <button onclick="ui.closeModal('modal-settings')" class="absolute top-2 right-2 text-xl sm:text-2xl pb-1 w-8 h-8 sm:w-10 sm:h-10 drawn-btn marker-red bg-white z-10">✖</button>
            <h2 class="text-3xl sm:text-4xl font-bold mb-4 sm:mb-6 text-slate-900">Настройки ⚙️</h2>
            
            <div class="flex flex-col gap-3 sm:gap-4 text-xl sm:text-2xl">
                <button onclick="audioManager.toggleMusic()" class="w-full drawn-btn marker-blue font-bold py-2 sm:py-3 px-3 sm:px-4 flex justify-between items-center">
                    <span>🎵 Музыка</span><span id="st-music-val" class="text-blue-700">ВКЛ</span>
                </button>
                <button onclick="audioManager.toggleSfx()" class="w-full drawn-btn marker-green font-bold py-2 sm:py-3 px-3 sm:px-4 flex justify-between items-center">
                    <span>🔊 Звуки</span><span id="st-sfx-val" class="text-green-700">ВКЛ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Продолжение игры (Синхронизация) -->
    <div id="modal-continue" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center p-2 sm:p-4 z-[55] hide modal-overlay backdrop-blur-md">
        <div class="drawn-box p-4 sm:p-8 text-center w-[95vw] sm:max-w-sm modal-content bg-[#fdf6e3]">
            <span class="text-5xl sm:text-6xl block mb-2">💾</span>
            <h2 class="text-3xl sm:text-4xl font-bold mb-2 text-slate-900">Сохранение</h2>
            <p class="text-lg sm:text-xl text-slate-700 mb-4 sm:mb-6">Найдена незаконченная игра. Хотите продолжить?</p>
            
            <div class="flex flex-col gap-2 sm:gap-3 text-xl sm:text-2xl">
                <button onclick="game.resumeSaved()" class="w-full drawn-btn marker-green font-bold py-2 px-4">Продолжить</button>
                <button onclick="game.discardSaved()" class="w-full drawn-btn marker-red font-bold py-2 px-4">Начать заново</button>
            </div>
        </div>
    </div>
    
    <!-- Финал уровня -->
    <div id="modal-end" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-2 sm:p-4 z-50 hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box p-4 sm:p-6 text-center w-[95vw] sm:max-w-sm modal-content bg-[#fdf6e3]">
            <h2 id="modal-title" class="text-4xl sm:text-5xl font-bold mb-2"></h2>
            <p class="text-slate-600 text-lg sm:text-xl font-bold mb-1">Слово было:</p>
            <p id="modal-word" class="text-2xl sm:text-4xl font-bold text-slate-900 mb-4 sm:mb-6 tracking-widest uppercase border-b-2 sm:border-b-4 border-slate-800 inline-block px-2 sm:px-4 pb-1" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;"></p>
            
            <div id="modal-rewards" class="flex justify-center gap-2 sm:gap-4 mb-4 sm:mb-6">
                <div class="drawn-btn marker-yellow px-2 sm:px-4 py-1 text-xl sm:text-2xl font-bold flex gap-1 sm:gap-2"><span>💰</span><span id="reward-coins">+0</span></div>
                <div class="drawn-btn marker-blue px-2 sm:px-4 py-1 text-xl sm:text-2xl font-bold flex gap-1 sm:gap-2"><span>🏆</span><span id="reward-score">+0</span></div>
            </div>

            <div class="flex flex-col gap-2 sm:gap-3 text-xl sm:text-2xl">
                <button onclick="game.nextWord()" class="w-full drawn-btn marker-green font-bold py-1.5 sm:py-2 px-4">След. слово 🚀</button>
                <button onclick="ui.goToMenu()" class="w-full drawn-btn border-slate-400 text-slate-600 font-bold py-1.5 sm:py-2 px-4">В меню</button>
            </div>
        </div>
    </div>

    <!-- Открытие нового уровня -->
    <div id="modal-levelup" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center p-2 sm:p-4 z-[55] hide modal-overlay backdrop-blur-md">
        <div class="drawn-box p-4 sm:p-8 text-center w-[95vw] sm:max-w-sm modal-content bg-[#fdf6e3]">
            <span class="text-5xl sm:text-6xl block mb-2">🎉</span>
            <h2 class="text-3xl sm:text-4xl font-bold mb-2 text-slate-900">Новый уровень!</h2>
            <p class="text-xl sm:text-2xl text-slate-700 mb-4 sm:mb-6">Открыта сложность:<br><span id="levelup-name" class="text-2xl sm:text-4xl text-blue-600 font-bold underline"></span></p>
            
            <div class="flex flex-col gap-2 sm:gap-3 text-xl sm:text-2xl">
                <button id="btn-goto-new" class="w-full drawn-btn marker-blue font-bold py-2 px-4">Перейти туда!</button>
                <button id="btn-stay-old" class="w-full drawn-btn border-slate-400 text-slate-600 font-bold py-2 px-4">Остаться здесь</button>
            </div>
        </div>
    </div>

    <!-- Магазин (Скины и Бусты) -->
    <div id="modal-shop" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-2 sm:p-4 z-50 hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box w-[95vw] sm:max-w-md h-[85vh] sm:h-[80vh] flex flex-col overflow-hidden modal-content bg-[#fdf6e3] relative">
            <button onclick="ui.closeModal('modal-shop')" class="absolute top-1 sm:top-2 right-1 sm:right-2 text-xl sm:text-2xl pb-1 w-8 h-8 sm:w-10 sm:h-10 drawn-btn marker-red bg-white z-10 flex items-center justify-center">✖</button>
            <div class="p-2 sm:p-4 border-b-2 sm:border-b-4 border-slate-800 flex justify-between items-center bg-white" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;">
                <h2 class="text-2xl sm:text-4xl font-bold ml-1 sm:ml-2">Магазин</h2>
                <div class="text-lg sm:text-2xl font-bold text-yellow-700 mr-8 sm:mr-10 bg-yellow-100 px-2 sm:px-3 py-0.5 drawn-box">💰 <span id="shop-coins">0</span></div>
            </div>
            
            <div class="flex border-b-2 sm:border-b-4 border-slate-800 text-lg sm:text-xl font-bold bg-white">
                <button onclick="shop.switchTab('skins')" id="tab-skins" class="flex-1 py-1 sm:py-2 text-blue-600 border-r-2 sm:border-r-4 border-slate-800">Скины</button>
                <button onclick="shop.switchTab('boosts')" id="tab-boosts" class="flex-1 py-1 sm:py-2 text-slate-500">Бусты</button>
            </div>

            <div class="flex-grow overflow-y-auto p-2 sm:p-4 paper-bg" id="shop-content"></div>
        </div>
    </div>

    <!-- Словарь -->
    <div id="modal-dict" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-2 sm:p-4 z-50 hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box w-[95vw] sm:max-w-md h-[80vh] sm:h-[70vh] flex flex-col overflow-hidden modal-content bg-[#fdf6e3] relative">
            <button onclick="ui.closeModal('modal-dict')" class="absolute top-1 sm:top-2 right-1 sm:right-2 text-xl sm:text-2xl pb-1 w-8 h-8 sm:w-10 sm:h-10 drawn-btn marker-red bg-white z-10 flex items-center justify-center">✖</button>
            <div class="p-3 sm:p-4 border-b-2 sm:border-b-4 border-slate-800 bg-white" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;">
                <h2 class="text-3xl sm:text-4xl font-bold">Словарь</h2>
                <p class="text-lg sm:text-xl text-slate-600">Отгадано: <span id="dict-count" class="font-bold text-blue-600">0</span></p>
            </div>
            <div class="flex-grow overflow-y-auto p-2 sm:p-4 flex flex-wrap gap-2 sm:gap-3 content-start paper-bg text-xl sm:text-2xl uppercase" id="dict-list"></div>
        </div>

        // --- VK BRIDGE ВЗАИМОДЕЙСТВИЕ И СОХРАНЕНИЕ ---
        let saveTimeout = null;
        const vk = {
            init: async () => {
                vkBridge.send('VKWebAppInit');
                
                vkBridge.subscribe((e) => {
                    if (e.detail.type === 'VKWebAppBannerAdUpdated') {

            save: (force = false) => {

        // --- ЛОГИКА ИГРЫ ---
        const game = {
            init: (diff) => {
                difficulty = diff; isPvp = false; gameActive = true;
                wrongGuesses = 0; guessedLetters = [];

                } else {
                    let pool = [];
                    if (diff === 'easy') pool = [...(words["4"]||[]), ...(words["5"]||[])];
                    else if (diff === 'medium') pool = [...(words["6"]||[]), ...(words["7"]||[])];
                    else if (diff === 'hard') pool = [...(words["8"]||[]), ...(words["9"]||[])];
                    else if (diff === 'impossible') pool = [...(words["10"]||[]), ...(words["11"]||[])];
                    else pool = Object.values(words).flat();

            resumeSaved: () => {
                ui.closeModal('modal-continue');

                difficulty = saved.difficulty;
                isPvp = saved.isPvp;
                currentWord = saved.currentWord;
                guessedLetters = saved.guessedLetters || [];
                wrongGuesses = saved.wrongGuesses || 0;
                gameActive = true;

                elements.mainMenu.classList.add('hide');
                elements.appContainer.classList.remove('hide');

                game.setupUI();
                draw.hangman(ctx, wrongGuesses);
            },
            discardSaved: () => {
                pData.activeGame = null;
                vk.save(true);
                ui.closeModal('modal-continue');
                ui.showMenu();
            },
            saveGameState: () => {
                if (gameActive && currentWord) {
                    pData.activeGame = { currentWord, guessedLetters, wrongGuesses, difficulty, isPvp, ts: Date.now() };
                    vk.save();
                }
            },
            setupUI: () => {
                const labels = {'easy': "ЛЕГКИЙ", 'medium': "СРЕДНИЙ", 'hard': "СЛОЖНЫЙ", 'impossible': "НЕВОЗМОЖНЫЙ", 'random': "РАНДОМ"};

                ui.updateCoins();
                elements.hintCountEl.textContent = pData.hints;
                elements.eraserCountEl.textContent = pData.erasers;
                ui.displayWord(); ui.createKeyboard(); draw.resizeCanvas();
            },
            handleGuess: (letter) => {
                if (!gameActive || guessedLetters.includes(letter)) return;
                guessedLetters.push(letter);
                const btn = document.getElementById(`key-${letter}`); btn.disabled = true;
                if (currentWord.includes(letter)) {
                    btn.classList.add('key-correct'); btn.classList.remove('text-slate-800');
                    audioManager.playSfx('correct'); 
                    ui.displayWord();
                } else {
                    wrongGuesses++; 
                    btn.classList.add('key-wrong'); btn.classList.remove('text-slate-800');
                    audioManager.playSfx('wrong'); 
                    draw.hangman(ctx, wrongGuesses);
                    if (wrongGuesses >= MAX_ERRORS) game.end(false);
                }
                game.saveGameState(); 
            },
            useHint: () => {
                if (!gameActive) return;
                if (pData.hints <= 0) { 
                    ui.showNotification("Закончились! Загляни в магазин 🛒");
                    setTimeout(() => { shop.open(); shop.switchTab('boosts'); }, 800);
                    return; 
                }
                const unguessed = currentWord.split('').filter(l => !guessedLetters.includes(l));
                if (unguessed.length === 0) return;
                pData.hints--; elements.hintCountEl.textContent = pData.hints;
                audioManager.playSfx('hint'); 
                game.handleGuess(unguessed[Math.floor(Math.random() * unguessed.length)]);
            },
            useEraser: () => {
                if (!gameActive) return;
                if (wrongGuesses <= 0) { ui.showNotification("Ошибок пока нет! 😉"); return; }
                if (pData.erasers <= 0) { 
                    ui.showNotification("Закончились! Загляни в магазин 🛒");
                    setTimeout(() => { shop.open(); shop.switchTab('boosts'); }, 800);
                    return; 
                }
                
                pData.erasers--; wrongGuesses--; 
                elements.eraserCountEl.textContent = pData.erasers;
                audioManager.playSfx('eraser'); 
                draw.hangman(ctx, wrongGuesses);
                game.saveGameState();
                ui.showNotification("Ошибка стёрта! 🧽");
            },
            end: (isWin) => {
                gameActive = false; pData.plays++;
                pData.activeGame = null; 
                let c = 0, s = 0;
                
                if (isWin) {
                    c = currentWord.length * 2 + (MAX_ERRORS - wrongGuesses) * 3;
                    s = currentWord.length * 5;
                    if(difficulty === 'daily') { c*=3; s*=3; }
                    pData.coins += c; pData.score += s;
                    if(!isPvp && difficulty !== 'daily') pData.stats[difficulty]++;
                    if(!pData.dict.includes(currentWord)) pData.dict.push(currentWord);
                }
                vk.save(true); ui.updateCoins();

                setTimeout(() => {
                    audioManager.playBgm('menu'); 
                    
                    let newlyUnlocked = null;
                    if (!isPvp && difficulty !== 'daily' && isWin) {
                        if (difficulty === 'easy' && statsBeforeGame.easy < 10 && pData.stats.easy >= 10) newlyUnlocked = 'medium';
                        if (difficulty === 'medium' && statsBeforeGame.medium < 10 && pData.stats.medium >= 10) newlyUnlocked = 'hard';
                        if (difficulty === 'hard' && statsBeforeGame.hard < 10 && pData.stats.hard >= 10) newlyUnlocked = 'impossible';
                        if (difficulty === 'impossible' && statsBeforeGame.impossible < 10 && pData.stats.impossible >= 10) newlyUnlocked = 'random';
                    }

                    if (pData.plays > 0 && pData.plays % 10 === 0) {
                        vk.showInterstitial();
                    }

                    if (newlyUnlocked) {
                        const names = {'medium': 'Средний', 'hard': 'Сложный', 'impossible': 'Невозможный', 'random': 'Бог Рандома'};
                        document.getElementById('levelup-name').textContent = names[newlyUnlocked];
                        document.getElementById('btn-goto-new').onclick = () => { ui.closeModal('modal-levelup'); game.init(newlyUnlocked); };
                        document.getElementById('btn-stay-old').onclick = () => { ui.closeModal('modal-levelup'); game.init(difficulty); };
                        ui.openModal('modal-levelup');
                    } else {
                        document.getElementById('modal-title').textContent = isWin ? 'Победа! 🎉' : 'Увы... 💀';
                        document.getElementById('modal-title').className = isWin ? 'text-4xl sm:text-5xl font-bold mb-2 text-green-600' : 'text-4xl sm:text-5xl font-bold mb-2 text-red-600';
                        document.getElementById('modal-word').textContent = currentWord;
                        document.getElementById('reward-coins').textContent = `+${c}`;
                        document.getElementById('reward-score').textContent = `+${s}`;
                        ui.openModal('modal-end');
                    }
                    ui.updateMenuStats();
                }, 800);
            },
            nextWord: () => {
                ui.closeModal('modal-end');

                else game.init(difficulty);
            }
        };

        // --- ОТРИСОВКА (CANVAS) В СТИЛЕ ФЛОМАСТЕРА ---
        const draw = {
            resizeCanvas: () => {
                const c = elements.canvas.parentElement; const s = Math.min(c.clientWidth, c.clientHeight);
                elements.canvas.width = s; elements.canvas.height = s;
                draw.hangman(ctx, wrongGuesses);
            },
            hangman: (context, errors) => {
                const w = context.canvas.width, h = context.canvas.height;
                context.clearRect(0, 0, w, h); 
                context.lineCap = 'round'; context.lineJoin = 'round';
                
                context.strokeStyle = '#1e293b'; 
                context.lineWidth = w * 0.035; 
                context.beginPath();
                
                const cX = w * 0.65, hY = h * 0.35, r = w * 0.06;

                if (errors > 0) { // 1
                    context.moveTo(w * 0.1, h * 0.95); context.lineTo(w * 0.9, h * 0.95);
                    context.moveTo(w * 0.3, h * 0.95); context.lineTo(w * 0.3, h * 0.1);
                }
                if (errors > 1) { // 2
                    context.moveTo(w * 0.3, h * 0.1); context.lineTo(w * 0.65, h * 0.1);
                    context.moveTo(w * 0.3, h * 0.25); context.lineTo(w * 0.45, h * 0.1);
                }
                if (errors > 2) { // 3
                    context.moveTo(w * 0.65, h * 0.1); context.lineTo(w * 0.65, hY - r);
                    context.stroke(); context.beginPath(); 
                    context.arc(cX, hY, r, 0, Math.PI * 2);
                }
                if (errors > 3) { // 4
                    context.moveTo(cX, hY + r); context.lineTo(cX, hY + r + h * 0.25);
                }
                if (errors > 4) { // 5
                    context.moveTo(cX, hY + r + h * 0.05); context.lineTo(cX - w * 0.12, hY + r + h * 0.15);
                }
                if (errors > 5) { // 6
                    context.moveTo(cX, hY + r + h * 0.05); context.lineTo(cX + w * 0.12, hY + r + h * 0.15);
                }
                if (errors > 6) { // 7
                    context.moveTo(cX, hY + r + h * 0.25); context.lineTo(cX - w * 0.1, hY + r + h * 0.4);
                }
                if (errors > 7) { // 8
                    context.moveTo(cX, hY + r + h * 0.25); context.lineTo(cX + w * 0.1, hY + r + h * 0.4);
                }
                context.stroke();

                if (errors > 2 && pData.equippedSkin > 0 && context === ctx) {
                    const skinMap = {0:'👤', 1:'🧢', 2:'🎩', 3:'👑', 4:'🕶️', 5:'🎀', 6:'😎', 9:'👽'};
                    context.font = `${r*2.5}px Arial`; context.textAlign = 'center'; context.textBaseline = 'middle';
                    const offset = [4, 6, 9].includes(pData.equippedSkin) ? 0 : -r; 
                    context.fillText(skinMap[pData.equippedSkin], cX, hY + offset);
                }
            }
        };

                    <div class="space-y-3 sm:space-y-4">
                        <div class="drawn-box bg-white p-3 sm:p-4 flex items-center justify-between">
                            <div class="flex items-center gap-2 sm:gap-3"><div class="text-3xl sm:text-4xl">💡</div><div class="leading-none"><p class="font-bold text-xl sm:text-2xl">Подсказка</p><p class="text-xs sm:text-sm text-slate-500">Откроет 1 букву</p></div></div>
                            <button onclick="shop.buyBoost('hint')" class="drawn-btn marker-yellow px-3 sm:px-4 py-1 text-lg sm:text-xl font-bold">💰 50</button>
                        </div>
                        <div class="drawn-box bg-white p-3 sm:p-4 flex items-center justify-between">
                            <div class="flex items-center gap-2 sm:gap-3"><div class="text-3xl sm:text-4xl">🧽</div><div class="leading-none"><p class="font-bold text-xl sm:text-2xl">Ластик</p><p class="text-xs sm:text-sm text-slate-500">Сотрет 1 ошибку</p></div></div>
                            <button onclick="shop.buyBoost('eraser')" class="drawn-btn marker-red px-3 sm:px-4 py-1 text-lg sm:text-xl font-bold">💰 50</button>
                        </div>
                        <p class="text-center text-base sm:text-lg text-slate-600 mt-2 font-bold">У вас: Подсказок — <span id="shop-hints">${pData.hints}</span> | Ластиков — <span id="shop-erasers">${pData.erasers}</span></p>
                    </div>`;
                }
            },
            handleSkin: (id, price) => {
                if(id === 0 || pData.skins.includes(id)) { 
                    pData.equippedSkin = id; 
                    audioManager.playClick();
                }
                else if(pData.coins >= price) { 
                    pData.coins -= price; 
                    pData.skins.push(id); 
                    pData.equippedSkin = id; 
                    if (pData.settings.sfx) audioManager.playSfx('correct'); 
                    ui.showNotification("Скин куплен! 🎉"); 
                }
                else { ui.showNotification("Мало монет! 💰"); return; }
                vk.save(true); ui.updateCoins(); shop.switchTab('skins'); if(gameActive) draw.hangman(ctx, wrongGuesses);
            },
            buyBoost: (type) => { 
                if(pData.coins >= 50) { pData.coins -= 50; if(type === 'hint') pData.hints++; if(type === 'eraser') pData.erasers++;
                    vk.save(true); ui.updateCoins(); elements.hintCountEl.textContent = pData.hints; elements.eraserCountEl.textContent = pData.erasers; 
                    if (document.getElementById('shop-hints')) { document.getElementById('shop-hints').textContent = pData.hints; document.getElementById('shop-erasers').textContent = pData.erasers; }
                    ui.showNotification("Куплено! 🛒");
                } else { ui.showNotification("Мало монет! 💰"); }
            },
            openChest: async (type) => {
                if (type === 'ad') { 
                    const res = await vk.showReward(); 
                    if(!res) { ui.showNotification("Реклама не досмотрена 🚫"); return; }
                } else { pData.freeChest = new Date().toISOString().split('T')[0]; }
                
                const rand = Math.random();
                if (rand < 0.20) { pData.hints++; ui.showNotification("🎉 +1 Подсказка!"); } else if (rand < 0.40) { pData.erasers++; ui.showNotification("🎉 +1 Ластик!"); }
                else { const c = Math.floor(Math.random() * 41) + 70; pData.coins += c; ui.showNotification(`🎉 +${c} 💰!`); }
                vk.save(true); ui.updateCoins(); shop.switchTab('boosts'); elements.hintCountEl.textContent = pData.hints; elements.eraserCountEl.textContent = pData.erasers;
            }
        };

        // --- АНИМИРОВАННОЕ ОБУЧЕНИЕ ---
        const tutorial = {
            active: false,
            start: async () => {
                tutorial.active = true;
                ui.openModal('tutorial-modal');
                document.getElementById('tut-btn-close').classList.remove('hide');
                
                const c = document.getElementById('tut-canvas'); 
                const s = Math.min(c.parentElement.clientWidth, c.parentElement.clientHeight, 200);
                c.width = s; c.height = s;
                
                const setWord = (str) => { 
                    document.getElementById('tut-word').innerHTML = str.split('').map(l => 
                        `<div class="flex items-center justify-center h-8 sm:h-10 w-5 sm:w-6 border-b-2 sm:border-b-4 border-slate-800 mx-0.5 mb-1 sm:mb-2"><span class="leading-none text-slate-900 pb-0.5 sm:pb-1 font-bold">${l === ' ' ? '&nbsp;' : l}</span></div>`
                    ).join(''); 
                };
                
                const pressKey = (id, type) => {
                    const k = document.getElementById(`tut-k-${id}`);
                    k.classList.add('anim-press');
                    setTimeout(() => {
                        k.classList.remove('anim-press');
                        if(type === 'correct') { k.className = 'w-8 h-8 sm:w-10 sm:h-10 border-2 border-green-600 bg-green-200 text-green-900 rounded-lg flex items-center justify-center pb-1 font-bold'; }
                        if(type === 'wrong') { k.className = 'w-8 h-8 sm:w-10 sm:h-10 border-2 border-slate-400 bg-transparent text-slate-400 rounded-lg flex items-center justify-center pb-1 line-through'; }
                    }, 200); 
                };

                const txt = document.getElementById('tut-text');
                
                while(tutorial.active) {
                    draw.hangman(tutCtx, 0); 
                    setWord('    '); 
                    document.querySelectorAll('[id^="tut-k-"]').forEach(k => k.className = 'w-8 h-8 sm:w-10 sm:h-10 border-2 border-slate-800 bg-white rounded-lg flex items-center justify-center pb-1 text-slate-800');
                    
                    txt.innerHTML = "Твоя цель &mdash; <span class='text-green-600'>разгадать слово!</span>"; 
                    await new Promise(r => setTimeout(r, 1000)); if(!tutorial.active) break; 
                    
                    txt.textContent = "Выбирай буквы на клавиатуре...";
                    await new Promise(r => setTimeout(r, 1200)); if(!tutorial.active) break; 
                    
                    pressKey('А', 'correct'); 
                    await new Promise(r => setTimeout(r, 400)); 
                    setWord('   А');
                    txt.innerHTML = "Верно! <span class='text-green-600'>Буква на месте.</span>"; 
                    await new Promise(r => setTimeout(r, 2000)); if(!tutorial.active) break; 
                    
                    txt.textContent = "А если ошибиться?"; 
                    await new Promise(r => setTimeout(r, 1200)); if(!tutorial.active) break; 
                    
                    pressKey('Б', 'wrong'); 
                    await new Promise(r => setTimeout(r, 400)); 
                    
                    for(let i=1; i<=4; i++) {
                        draw.hangman(tutCtx, i);
                        await new Promise(r => setTimeout(r, 75)); 
                    }
                    txt.innerHTML = "За ошибку <span class='text-red-600'>рисуем деталь...</span>"; 
                    await new Promise(r => setTimeout(r, 2000)); if(!tutorial.active) break; 
                    
                    await new Promise(r => setTimeout(r, 600)); if(!tutorial.active) break; 
                    
                    pressKey('В', 'wrong'); 
                    await new Promise(r => setTimeout(r, 400)); 
                    
                    for(let i=5; i<=8; i++) {
                        draw.hangman(tutCtx, i);
                        await new Promise(r => setTimeout(r, 75)); 
                    }
                    txt.innerHTML = "<span class='text-red-600'>8 ошибок</span> &mdash; и ты проиграл!";
                    await new Promise(r => setTimeout(r, 3500));
                }
            },
            end: () => { tutorial.active = false; pData.tut = true; vk.save(true); ui.closeModal('tutorial-modal'); ui.showMenu(); }
        };

        const pvp = {
            open: () => ui.openModal('modal-pvp'),
            createLink: () => {
                const w = document.getElementById('pvp-input').value.toUpperCase().trim().replace(/[^А-ЯЁ]/g, '');
                if (w.length < 3) { ui.showNotification("От 3 букв (кириллица)!"); return; }
                vkBridge.send('VKWebAppShare', { link: `https://vk.com/app${APP_ID}#pvp=${btoa(unescape(encodeURIComponent(w)))}` }).then(() => ui.closeModal('modal-pvp'));
            },
            start: (word) => { ui.closeAllModals(); game.init('pvp'); isPvp = true; currentWord = word.toUpperCase(); game.setupUI(); }
        };

        const dict = { open: () => { ui.openModal('modal-dict'); document.getElementById('dict-count').textContent = pData.dict.length; document.getElementById('dict-list').innerHTML = pData.dict.length ? pData.dict.map(w => `<div class="drawn-box bg-blue-50 text-blue-900 px-2 sm:px-3 py-0.5 sm:py-1 font-bold">${w}</div>`).join('') : '<p class="text-slate-500 w-full text-center mt-10">Тут пока пусто.</p>'; } };

        vk.init();
    </script>
</body>
</html>
