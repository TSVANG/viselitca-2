<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои 10 Ценностей</title>
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- VK Bridge & HTML2Canvas -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        
        * {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }

        #app {
            padding-bottom: 60px; /* Место для мобильного баннера VK */
        }

        .card-enter { animation: fadeInUp 0.4s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .value-card {
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.2s;
            touch-action: manipulation;
        }
        .value-card:active:not(:disabled) { transform: scale(0.92); }
        .throwing-away { animation: throwAway 0.3s forwards; }
        @keyframes throwAway {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.7) rotate(10deg); opacity: 0.5; }
            100% { transform: scale(0) translateY(50px); opacity: 0; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.1);
        }

        .custom-scroll {
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 4px; }

        @media (max-width: 320px) {
            h1 { font-size: 0.9rem !important; }
            h2 { font-size: 1rem !important; }
            .value-card { padding: 0.4rem !important; min-height: 44px !important; }
            .value-card span { font-size: 0.75rem !important; line-height: 1.1; }
            .game-btn { padding: 0.5rem 0.5rem !important; font-size: 0.8rem !important; }
        }

        .modal {
            position: fixed; inset: 0; z-index: 100;
            display: none; justify-content: center; align-items: center;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e293b; color: white; border-radius: 16px;
            padding: 20px; width: 90%; max-width: 340px; text-align: center;
            border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-btn {
            padding: 10px 15px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; border: none; font-size: 0.9rem; transition: transform 0.1s;
        }
        .modal-btn:active { transform: scale(0.95); }
        .modal-btn.primary { background: #4f46e5; color: white; }
        .modal-btn.secondary { background: #475569; color: white; }

        .games-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; margin-top: 15px;
        }
        .game-card {
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 5px; 
            cursor: pointer; transition: transform 0.1s; border: 1px solid #444;
            display: flex; flex-direction: column; align-items: center;
        }
        .game-card:active { transform: scale(0.95); }
        .game-img {
            width: 100%; aspect-ratio: 1/1; background: #333; border-radius: 10px; 
            margin-bottom: 5px; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .game-title {
            font-size: 0.65rem; font-weight: bold; color: #fff; text-align: center; line-height: 1.1;
        }
    </style>
</head>
<body class="text-slate-800" oncontextmenu="return false;">

    <div id="app" class="h-full w-full flex flex-col p-2 max-w-4xl mx-auto relative">
        <!-- Header -->
        <header class="flex justify-between items-center mb-2 shrink-0 z-20">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 sm:w-10 sm:h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md text-sm sm:text-base">
                    <i class="fas fa-gem"></i>
                </div>
                <h1 class="text-sm sm:text-lg font-bold text-indigo-900 leading-none">Core<br>Values</h1>
            </div>
            <div class="flex items-center gap-2">
                <!-- Кнопка Каталога Игр (Обновленная) -->
                <button id="games-btn" class="h-9 px-3 bg-indigo-100 rounded-full flex items-center justify-center shadow text-indigo-600 hover:bg-indigo-200 transition-colors gap-1.5 border border-indigo-200">
                    <i class="fas fa-gamepad text-sm"></i> <span class="text-xs font-bold uppercase tracking-wide">Игры</span>
                </button>
                <!-- Корзина -->
                <button onclick="toggleTrashModal()" class="relative group p-1">
                    <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center shadow text-slate-500 hover:text-red-500 border border-slate-100">
                        <i class="fas fa-trash-alt text-sm"></i>
                    </div>
                    <span id="trashCountBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full transform scale-0 transition-transform duration-200">0</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="gameArea" class="flex-grow flex flex-col relative overflow-hidden"></main>
    </div>

    <!-- Trash Modal -->
    <div id="trashModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="toggleTrashModal()"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-xs bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col" id="trashPanel">
            <div class="p-3 border-b flex justify-between items-center bg-slate-50 shrink-0">
                <h2 class="font-bold text-slate-800"><i class="fas fa-trash-restore mr-2 text-slate-400"></i>Корзина</h2>
                <button onclick="toggleTrashModal()" class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center"><i class="fas fa-times text-slate-500"></i></button>
            </div>
            <div id="trashContent" class="flex-grow overflow-y-auto p-3 custom-scroll grid grid-cols-2 gap-2 content-start"></div>
        </div>
    </div>

    <!-- Модальное окно: Сохранения -->
    <div id="sync-modal" class="modal">
        <div class="modal-content">
            <div class="text-3xl text-indigo-400 mb-2"><i class="fas fa-cloud-download-alt"></i></div>
            <h2 class="text-lg font-bold mb-2">Найдено сохранение</h2>
            <p class="text-sm text-slate-300 mb-4">У вас есть незаконченный прогресс. Хотите продолжить с того же места?</p>
            <button onclick="loadGameAndStart()" class="modal-btn primary">Продолжить игру</button>
            <button onclick="startNewGame()" class="modal-btn secondary">Начать заново</button>
        </div>
    </div>

    <!-- Каталог Игр -->
    <div id="games-modal" class="modal">
        <div class="modal-content">
            <h2 class="text-lg font-bold">🎮 Мои Игры</h2>
            <div id="games-list" class="games-grid"></div>
            <button class="modal-btn primary" id="close-games-btn">Закрыть</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const rawCategories = {
            "Развитие": ["Анализ", "Внимательность", "Гибкость", "Дальновидность", "Делегирование", "Интеллект", "Логика", "Навыки", "Осознанность", "Привычки", "Проницательность", "Сосредоточенность","Уникальность", "Эффективность"],
            "Материальное": ["Активы", "Амбициозность", "Бизнес", "Богатство", "Власть", "Выгода", "Деньги", "Достижение", "Законность", "Инвестиции", "Инновация", "Капитал", "Комфорт", "Конкуренция", "Обладание", "Предприимчивость", "Предпринимательство", "Престиж", "Прибыльность", "Риск", "Роскошь", "Собственность", "Стабильность", "Статус", "Честолюбие"],
            "Самореализация": ["Автономность","Воображение", "Вызов", "Глобальность", "Знания", "Индивидуальность", "Искусность", "Исследование", "Карьера", "Качество", "Компетентность", "Креативность", "Лидерство", "Мастерство", "Мотивация", "Независимость", "Последовательность", "Призвание", "Профессионализм", "Руководство", "Трудолюбие", "Удовлетворенность", "Успех", "Целеустремлённость", "Энтузиазм"],
            "Духовность": ["Аскетизм", "Безмятежность", "Бог", "Гармония", "Глубина", "Истина", "Лёгкость", "Любопытство", "Мудрость", "Познание", "Прозрачность", "Простота", "Смирение", "Созидание", "Сотрудничество", "Сочувствие", "Счастье", "Творчество", "Терпимость", "Тишина", "Толерантность", "Умиротворение", "Философия", "Этичность"],
            "Отношения": ["Альтруизм", "Близость", "Верность", "Доброта", "Доверие", "Дружба", "Искренность", "Красота", "Поддержка", "Преданность", "Принятие", "Радость", "Свобода", "Страсть", "Уверенность в себе", "Чувственность"],
            "Нравственность": ["Вежливость", "Великодушие", "Дисциплина", "Достоинство", "Зрелость", "Отвага", "Ответственность", "Решительность", "Самостоятельность", "Сдержанность", "Смелость", "Спокойствие", "Уверенность","Цельность"],
            "Радость": ["Вдохновение", "Веселье", "Восторг", "Досуг", "Жизнерадостность", "Наслаждение", "Развлечение", "Удивление", "Хобби", "Эстетичность", "Юмор"],
            "Здоровье": ["Активность", "Выносливость", "Естественность", "Ловкость", "Подвижность","Спорт", "Ухоженность", "Фитнес", "Энергичность"],
            "Семья": ["Близкие", "Взаимопонимание", "Дети", "Забота","Принадлежность", "Прощение", "Родственники","Традиции"],
            "Мораль": ["Благородность", "Правда", "Принципиальность", "Равенство", "Справедливость", "Уважение", "Честность", "Честь", "Экологичность"]
        };

        let gameState = {
            stage: 'intro', categoryKeys: Object.keys(rawCategories), currentCategoryIndex: 0,
            values: [], trash: [], semifinal1_ids: [], semifinal2_ids: []
        };
        
        let loadedState = null;
        let isPaused = false; 

        // --- ИНИЦИАЛИЗАЦИЯ VK ---
        window.onload = function() {
            if (window.vkBridge) {
                vkBridge.send("VKWebAppInit").then(() => {
                    // Вызов мобильного баннера ВКонтакте
                    vkBridge.send("VKWebAppShowBannerAd", { banner_location: "bottom" }).catch(console.error);
                    
                    vkBridge.send("VKWebAppStorageGet", { keys: ["saveData10Val"] }).then((data) => {
                        if (data.keys && data.keys[0].value) {
                            loadedState = JSON.parse(data.keys[0].value);
                            if (loadedState && loadedState.stage !== 'result') {
                                document.getElementById('sync-modal').style.display = 'flex';
                                return;
                            }
                        }
                        startNewGame();
                    }).catch(() => startNewGame());
                }).catch(() => startNewGame());
            } else {
                startNewGame();
            }

            document.addEventListener('touchmove', function(e) { 
                if(!e.target.closest('.custom-scroll')) e.preventDefault(); 
            }, { passive: false });
        };

        // --- СОХРАНЕНИЯ В ОБЛАКО VK (Ультра-сжатие) ---
        function saveProgress() {
            if (!window.vkBridge || gameState.stage === 'intro') return;
            const compactSave = {
                st: gameState.stage,
                ci: gameState.currentCategoryIndex,
                t: gameState.trash.map(v => v.id), 
                s1: gameState.semifinal1_ids,
                s2: gameState.semifinal2_ids
            };
            vkBridge.send("VKWebAppStorageSet", {
                key: "saveData10Val",
                value: JSON.stringify(compactSave)
            }).catch(console.error);
        }

        // --- ЗАПРОС УВЕДОМЛЕНИЙ ---
        function requestNotificationsAnd(callback) {
            if (window.vkBridge) {
                vkBridge.send('VKWebAppAllowNotifications')
                    .then((data) => {
                        console.log("Push Notification Result:", data);
                        callback();
                    })
                    .catch((err) => {
                        console.error("Push Notification Error (Check App Settings in VK Dev Console!):", err);
                        callback(); 
                    });
            } else {
                callback();
            }
        }

        // --- УПРАВЛЕНИЕ ИГРОЙ ---
        function generateValues() {
            let idCounter = 0;
            gameState.values = [];
            gameState.categoryKeys.forEach(cat => {
                rawCategories[cat].forEach(word => {
                    gameState.values.push({ id: idCounter++, text: word, category: cat, status: 'active' });
                });
            });
        }

        function startNewGame() {
            document.getElementById('sync-modal').style.display = 'none';
            gameState.stage = 'intro';
            gameState.currentCategoryIndex = 0;
            gameState.trash = [];
            gameState.semifinal1_ids = [];
            gameState.semifinal2_ids = [];
            generateValues();
            renderIntro();
            updateTrashBadge();
        }

        function loadGameAndStart() {
            document.getElementById('sync-modal').style.display = 'none';
            generateValues();
            
            gameState.stage = loadedState.st;
            gameState.currentCategoryIndex = loadedState.ci;
            gameState.semifinal1_ids = loadedState.s1 || [];
            gameState.semifinal2_ids = loadedState.s2 || [];
            
            gameState.trash = [];
            if(loadedState.t) {
                loadedState.t.forEach(tId => {
                    let item = gameState.values.find(v => v.id === tId);
                    if(item) {
                        item.status = 'trashed';
                        gameState.trash.push(item);
                    }
                });
            }

            updateTrashBadge();
            
            if (gameState.stage === 'filtering') renderCategoryStep();
            else if (gameState.stage.startsWith('semifinal')) renderSemifinalStep();
            else if (gameState.stage === 'final') renderFinalStage();
            else startNewGame();
        }

        // --- RENDERERS ---
        function renderIntro() {
            document.getElementById('gameArea').innerHTML = `
                <div class="h-full flex flex-col items-center justify-center p-2 card-enter custom-scroll">
                    <div class="glass-panel w-full rounded-2xl p-4 sm:p-6 text-center max-w-sm mx-auto">
                        <div class="mb-3 inline-block p-2 rounded-full bg-indigo-100 text-indigo-600 text-2xl">
                            <i class="fas fa-compass"></i>
                        </div>
                        <h2 class="text-lg font-bold text-indigo-900 mb-1">Твои Ценности</h2>
                        <p class="text-slate-600 text-[11px] sm:text-sm mb-4 leading-tight">
                            У нас ${gameState.values.length} слов. Выбирай только самое важное.
                        </p>
                        <ul class="text-left text-slate-600 mb-5 space-y-1 text-xs sm:text-sm">
                            <li><i class="fas fa-filter text-indigo-500 w-5"></i> Убираем лишнее по категориям.</li>
                            <li><i class="fas fa-layer-group text-purple-500 w-5"></i> Жесткий отбор в полуфиналах.</li>
                            <li><i class="fas fa-trophy text-green-500 w-5"></i> Оставляем Топ-10 в финале.</li>
                        </ul>
                        <button onclick="startFiltering()" class="game-btn bg-indigo-600 text-white font-bold py-3 w-full rounded-xl shadow-lg active:scale-95 transition-all text-sm sm:text-base">
                            Начать отбор
                        </button>
                    </div>
                </div>
            `;
        }

        function startFiltering() {
            gameState.stage = 'filtering';
            saveProgress();
            renderCategoryStep();
        }

        // УМНОЕ ОБНОВЛЕНИЕ UI (Без морганий и перезагрузки кнопок)
        function updateDynamicUI() {
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');
            const nextBtn = document.getElementById('nextBtn');
            if (!progressText || !progressBar || !nextBtn) return;

            if (gameState.stage === 'filtering') {
                const catName = gameState.categoryKeys[gameState.currentCategoryIndex];
                const catItems = gameState.values.filter(v => v.category === catName && v.status === 'active');
                const totalInCat = rawCategories[catName].length; 
                const trashedCount = totalInCat - catItems.length;
                const targetTrash = Math.ceil(totalInCat * 0.4);
                const isTargetMet = trashedCount >= targetTrash;
                const percentComplete = Math.min(100, (trashedCount / targetTrash) * 100);

                progressText.textContent = `Убрано: ${trashedCount}/${targetTrash}`;
                progressText.parentElement.className = `text-[10px] sm:text-xs font-bold ${isTargetMet ? 'text-green-600' : 'text-orange-500'}`;
                progressBar.style.width = `${percentComplete}%`;
                progressBar.className = `h-full transition-all ${isTargetMet ? 'bg-green-500' : 'bg-orange-400'}`;
                
                if(isTargetMet) {
                    nextBtn.disabled = false;
                    nextBtn.className = "game-btn bg-indigo-600 text-white shadow-lg animate-pulse w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm sm:text-base";
                    nextBtn.textContent = (gameState.currentCategoryIndex < gameState.categoryKeys.length - 1 ? 'Дальше' : 'К полуфиналу');
                } else {
                    nextBtn.disabled = true;
                    nextBtn.className = "game-btn bg-slate-300 text-slate-500 w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm sm:text-base cursor-not-allowed";
                    nextBtn.textContent = `Уберите еще ${targetTrash - trashedCount}`;
                }
            } else if (gameState.stage.startsWith('semifinal')) {
                const isGroup1 = gameState.stage === 'semifinal_1';
                const currentGroupIds = isGroup1 ? gameState.semifinal1_ids : gameState.semifinal2_ids;
                const catItems = gameState.values.filter(v => currentGroupIds.includes(v.id) && v.status === 'active');
                const trashedCount = currentGroupIds.length - catItems.length;
                const targetTrash = Math.ceil(currentGroupIds.length * 0.7);
                const isTargetMet = trashedCount >= targetTrash;
                const percentComplete = Math.min(100, (trashedCount / targetTrash) * 100);

                progressText.textContent = `Убрано: ${trashedCount}/${targetTrash}`;
                progressText.parentElement.className = `text-[10px] sm:text-xs font-bold ${isTargetMet ? 'text-green-600' : 'text-orange-500'}`;
                progressBar.style.width = `${percentComplete}%`;
                progressBar.className = `h-full transition-all ${isTargetMet ? 'bg-green-500' : 'bg-orange-400'}`;
                
                if(isTargetMet) {
                    nextBtn.disabled = false;
                    nextBtn.className = "game-btn bg-indigo-600 text-white shadow-lg animate-pulse w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm sm:text-base";
                    nextBtn.textContent = (isGroup1 ? 'Дальше' : 'К финалу');
                } else {
                    nextBtn.disabled = true;
                    nextBtn.className = "game-btn bg-slate-300 text-slate-500 w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm sm:text-base cursor-not-allowed";
                    nextBtn.textContent = `Уберите еще ${targetTrash - trashedCount}`;
                }
            } else if (gameState.stage === 'final') {
                const activeItems = gameState.values.filter(v => v.status === 'active');
                const currentCount = activeItems.length;
                const targetRemaining = 10;
                
                progressText.textContent = `Осталось: ${currentCount} / 10`;
                progressText.className = `text-[10px] sm:text-xs font-bold ${currentCount === 10 ? 'text-green-600' : 'text-orange-500'}`;

                if (currentCount === targetRemaining) {
                    nextBtn.disabled = false; 
                    nextBtn.className = "game-btn bg-green-500 text-white shadow-lg animate-pulse w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm sm:text-base"; 
                    nextBtn.textContent = 'Посмотреть результат';
                } else if (currentCount > targetRemaining) {
                    nextBtn.disabled = true;
                    nextBtn.className = "game-btn bg-slate-300 text-slate-500 w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm sm:text-base cursor-not-allowed"; 
                    nextBtn.textContent = `Уберите еще ${currentCount - targetRemaining}`;
                } else {
                    nextBtn.disabled = true;
                    nextBtn.className = "game-btn bg-red-400 text-white w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm sm:text-base cursor-not-allowed"; 
                    nextBtn.textContent = `Верните ${targetRemaining - currentCount} из корзины`;
                }
            }
        }

        function renderCategoryStep() {
            const catName = gameState.categoryKeys[gameState.currentCategoryIndex];
            const catItems = gameState.values.filter(v => v.category === catName && v.status === 'active');
            
            const container = document.getElementById('gameArea');
            let itemsHTML = catItems.map(item => `
                <button type="button" onclick="throwToTrash(${item.id}, this)" class="value-card bg-white border border-slate-200 rounded-xl p-2 sm:p-3 flex items-center justify-center cursor-pointer shadow-sm relative min-h-[48px] sm:min-h-[60px] w-full">
                    <span class="font-bold text-slate-700 text-xs sm:text-sm text-center leading-tight pointer-events-none break-words">${item.text}</span>
                </button>
            `).join('');

            container.innerHTML = `
                <div class="h-full flex flex-col card-enter w-full">
                    <div class="flex-none mb-2 px-1">
                        <div class="flex justify-between items-end mb-1 text-[10px] sm:text-xs font-bold">
                             <div class="text-indigo-400 uppercase">Категория ${gameState.currentCategoryIndex + 1}/${gameState.categoryKeys.length}</div>
                             <div class="text-orange-500"><span id="progressText"></span></div>
                        </div>
                        <div class="h-1.5 w-full bg-gray-200 rounded-full mb-1"><div id="progressBar" class="h-full bg-orange-400 transition-all" style="width: 0%"></div></div>
                        <h2 class="text-lg sm:text-xl font-bold text-slate-800 leading-tight">${catName}</h2>
                    </div>
                    <div class="flex-grow overflow-y-auto custom-scroll glass-panel rounded-xl p-2 pb-16">
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${itemsHTML}</div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-white via-white to-transparent flex justify-center">
                         <button id="nextBtn" onclick="nextCategory()" class="game-btn w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm"></button>
                    </div>
                </div>
            `;
            updateDynamicUI(); // Инициализация текстов и бара
        }

        function throwToTrash(id, element) {
            if(isPaused || element.disabled) return;
            const item = gameState.values.find(v => v.id === id);
            if (!item) return;

            element.disabled = true; // Защита от пролагивания при множественных кликах
            element.classList.add('throwing-away');
            
            setTimeout(() => {
                item.status = 'trashed';
                gameState.trash.push(item);
                updateTrashBadge();
                saveProgress(); 
                element.style.display = 'none';
                updateDynamicUI(); // Умное обновление интерфейса без полной перерисовки
            }, 300);
        }

        function restoreFromTrash(id) {
            const index = gameState.trash.findIndex(v => v.id === id);
            if (index > -1) {
                const item = gameState.trash[index];
                item.status = 'active'; 
                gameState.trash.splice(index, 1);
                updateTrashBadge();
                saveProgress();
                renderTrashContent();
                
                if (gameState.stage === 'filtering') {
                    if (item.category === gameState.categoryKeys[gameState.currentCategoryIndex]) renderCategoryStep(); 
                } else if (gameState.stage === 'semifinal_1') {
                    if (!gameState.semifinal1_ids.includes(id)) gameState.semifinal1_ids.push(id);
                    renderSemifinalStep();
                } else if (gameState.stage === 'semifinal_2') {
                    if (!gameState.semifinal2_ids.includes(id)) gameState.semifinal2_ids.push(id);
                    renderSemifinalStep();
                } else if (gameState.stage === 'final') {
                    renderFinalStage();
                }
            }
        }

        function nextCategory() {
            if (gameState.currentCategoryIndex < gameState.categoryKeys.length - 1) {
                gameState.currentCategoryIndex++;
                saveProgress();
                renderCategoryStep();
            } else {
                prepareSemifinals();
            }
        }

        function prepareSemifinals() {
            let activeItems = gameState.values.filter(v => v.status === 'active').sort(() => Math.random() - 0.5);
            const half = Math.ceil(activeItems.length / 2);
            gameState.semifinal1_ids = activeItems.slice(0, half).map(v => v.id);
            gameState.semifinal2_ids = activeItems.slice(half).map(v => v.id);
            gameState.stage = 'semifinal_1';
            saveProgress();
            renderSemifinalStep();
        }

        function renderSemifinalStep() {
            const isGroup1 = gameState.stage === 'semifinal_1';
            const currentGroupIds = isGroup1 ? gameState.semifinal1_ids : gameState.semifinal2_ids;
            const catItems = gameState.values.filter(v => currentGroupIds.includes(v.id) && v.status === 'active');

            let itemsHTML = catItems.map(item => `
                <button type="button" onclick="throwToTrash(${item.id}, this)" class="value-card bg-white border border-slate-200 rounded-xl p-2 sm:p-3 flex items-center justify-center cursor-pointer shadow-sm relative min-h-[48px] sm:min-h-[60px] w-full">
                    <span class="font-bold text-slate-700 text-xs sm:text-sm text-center leading-tight pointer-events-none break-words">${item.text}</span>
                </button>
            `).join('');

            document.getElementById('gameArea').innerHTML = `
                <div class="h-full flex flex-col card-enter w-full">
                    <div class="flex-none mb-2 px-1">
                        <div class="flex justify-between items-end mb-1 text-[10px] sm:text-xs font-bold">
                             <div class="text-indigo-400 uppercase">Полуфинал ${isGroup1 ? '1/2' : '2/2'}</div>
                             <div class="text-orange-500"><span id="progressText"></span></div>
                        </div>
                        <div class="h-1.5 w-full bg-gray-200 rounded-full mb-1"><div id="progressBar" class="h-full bg-orange-400 transition-all" style="width: 0%"></div></div>
                        <h2 class="text-lg sm:text-xl font-bold text-slate-800 leading-tight">Группа ${isGroup1 ? '1' : '2'}</h2>
                    </div>
                    <div class="flex-grow overflow-y-auto custom-scroll glass-panel rounded-xl p-2 pb-16">
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${itemsHTML}</div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-white via-white to-transparent flex justify-center">
                         <button id="nextBtn" onclick="nextSemifinal()" class="game-btn w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm"></button>
                    </div>
                </div>
            `;
            updateDynamicUI();
        }

        function nextSemifinal() {
            if (gameState.stage === 'semifinal_1') {
                gameState.stage = 'semifinal_2';
                saveProgress();
                renderSemifinalStep();
            } else {
                gameState.stage = 'final';
                saveProgress();
                renderFinalStage();
            }
        }

        function renderFinalStage() {
            const activeItems = gameState.values.filter(v => v.status === 'active');
            
            let itemsHTML = activeItems.map(item => `
                <button type="button" onclick="throwToTrash(${item.id}, this)" class="value-card bg-white border border-slate-200 rounded-xl p-2 sm:p-3 flex items-center justify-center cursor-pointer shadow-sm relative min-h-[48px] sm:min-h-[60px] w-full">
                    <span class="font-bold text-slate-700 text-xs sm:text-sm text-center leading-tight pointer-events-none break-words">${item.text}</span>
                </button>
            `).join('');

            document.getElementById('gameArea').innerHTML = `
                <div class="h-full flex flex-col card-enter w-full">
                     <div class="flex-none text-center mb-2 px-1">
                        <h2 class="text-lg font-bold text-slate-800">Финал: Топ-10</h2>
                        <div id="progressText" class="text-[10px] font-bold text-orange-500"></div>
                    </div>
                    <div class="flex-grow overflow-y-auto custom-scroll glass-panel rounded-xl p-2 pb-16">
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${itemsHTML}</div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-2 bg-white/90 backdrop-blur flex justify-center border-t border-slate-100">
                        <button id="nextBtn" onclick="finishGame()" class="game-btn w-full max-w-sm py-2.5 rounded-xl font-bold transition-all text-sm"></button>
                    </div>
                </div>
            `;
            updateDynamicUI();
        }

        // --- FINAL RESULTS & STORIES ---
        function finishGame() {
            gameState.stage = 'result';
            saveProgress();
            const top10 = gameState.values.filter(v => v.status === 'active');
            
            // Квадратные карточки для красивого результата
            let listHTML = top10.map(item => `
                <div class="flex items-center justify-center p-2 bg-white rounded-xl shadow-sm border border-slate-100 h-full">
                    <div class="text-[11px] sm:text-xs font-bold text-slate-800 text-center break-words">${item.text}</div>
                </div>
            `).join('');

            document.getElementById('gameArea').innerHTML = `
                <div class="h-full flex flex-col card-enter max-w-sm mx-auto w-full overflow-hidden" id="capture-container">
                    
                    <!-- Область для генерации картинки в Историю -->
                    <div id="story-capture" class="flex-grow custom-scroll p-4 bg-gradient-to-br from-indigo-50 to-blue-50 rounded-xl border border-indigo-100 flex flex-col justify-between">
                        <div class="text-center mb-3 mt-2 shrink-0">
                            <div class="w-12 h-12 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-xl mx-auto mb-2 shadow-inner">
                                <i class="fas fa-compass"></i>
                            </div>
                            <h2 class="text-base font-bold text-indigo-900">Мои Главные Ценности</h2>
                            <p class="text-[10px] text-slate-500">Мини-апп ВКонтакте</p>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-auto mb-auto w-full h-[70%] px-1">
                            ${listHTML}
                        </div>
                        <div class="shrink-0 mt-4 text-center text-[10px] font-medium text-slate-400">Узнай свои ценности!</div>
                    </div>

                    <!-- Кнопки действий -->
                    <div class="flex-none p-2 flex flex-col gap-2 justify-center mt-2" id="final-buttons">
                        <button onclick="handleSaveAndStory()" class="w-full bg-blue-500 text-white py-3 rounded-xl font-bold shadow hover:bg-blue-600 text-sm flex items-center justify-center gap-2">
                            <i class="fab fa-vk"></i> Сохранить и Поделиться
                        </button>
                        <button onclick="requestNotificationsAnd(startNewGame)" class="w-full bg-white text-slate-600 border border-slate-300 py-3 rounded-xl font-bold text-sm">
                            Начать заново
                        </button>
                    </div>
                </div>
            `;
            
            // Скрываем корзину в хедере на финальном экране
            const trashBtn = document.querySelector('header button.relative.group');
            if(trashBtn) trashBtn.style.display = 'none';
        }

        // ОБЪЕДИНЕННАЯ ФУНКЦИЯ (Сохранить + Скриншот Истории + Пуши + Каталог)
        function handleSaveAndStory() {
            saveProgress();
            
            const captureArea = document.getElementById('story-capture');
            const btnArea = document.getElementById('final-buttons');
            const header = document.querySelector('header');
            
            // Жестко фиксируем размеры блока, чтобы скриншот 9:16 не поплыл на разных телефонах
            const origClass = captureArea.className;
            captureArea.className = "p-5 bg-gradient-to-br from-indigo-50 to-blue-50 flex flex-col justify-between"; 
            captureArea.style.width = "360px";
            captureArea.style.height = "640px";
            
            // Прячем лишнее
            btnArea.style.display = "none";
            if(header) header.style.display = "none";
            window.scrollTo(0,0);

            html2canvas(captureArea, { scale: 2, backgroundColor: "#f8fafc" }).then(canvas => {
                // Восстанавливаем оригинальный интерфейс
                captureArea.className = origClass;
                captureArea.style.width = "";
                captureArea.style.height = "";
                btnArea.style.display = "flex";
                if(header) header.style.display = "flex";
                
                const base64image = canvas.toDataURL("image/png");
                
                if (window.vkBridge) {
                    vkBridge.send("VKWebAppShowStoryBox", {
                        background_type: "image",
                        blob: base64image
                    }).finally(() => {
                        // Как только завершили или отменили Историю -> Запрос пушей -> Открываем Игры
                        requestNotificationsAnd(() => openGamesCatalog(true));
                    });
                } else {
                    requestNotificationsAnd(() => openGamesCatalog(true));
                }
            }).catch(e => {
                console.error("Canvas error", e);
                captureArea.className = origClass;
                captureArea.style.width = "";
                captureArea.style.height = "";
                btnArea.style.display = "flex";
                if(header) header.style.display = "flex";
                requestNotificationsAnd(() => openGamesCatalog(true));
            });
        }

        // --- TRASH MODAL ---
        function updateTrashBadge() {
            const badge = document.getElementById('trashCountBadge');
            badge.textContent = gameState.trash.length;
            if (gameState.trash.length > 0) badge.classList.remove('scale-0');
            else badge.classList.add('scale-0');
        }

        function toggleTrashModal() {
            if(isPaused) return;
            const modal = document.getElementById('trashModal');
            const panel = document.getElementById('trashPanel');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => { panel.classList.remove('translate-x-full'); }, 10);
                renderTrashContent();
            } else {
                panel.classList.add('translate-x-full');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
        }

        function renderTrashContent() {
            const container = document.getElementById('trashContent');
            if (gameState.trash.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-slate-400 mt-5 text-[10px]">Пусто</div>`;
                return;
            }
            container.innerHTML = gameState.trash.map(item => `
                <div onclick="restoreFromTrash(${item.id})" class="bg-red-50 border border-red-100 p-1.5 rounded text-[10px] text-slate-700 cursor-pointer relative group">
                    <span class="font-bold truncate block pr-3">${item.text}</span>
                    <i class="fas fa-undo absolute right-1 top-2 text-green-600"></i>
                </div>
            `).join('');
        }

        // --- КАТАЛОГ ИГР (CROSS-PROMO) ---
        const GAMES_CATALOG = [
            { id: 54691165, name: "Wordle", img: "Wordle.png" }, 
            { id: 54053077, name: "Виселица", img: "viselitsa.png" },
            { id: 54051783, name: "Numberzilla", img: "Numberzilla.png" },
            { id: 54688189, name: "Судоку", img: "Sudoku.png" },
            { id: 54691070, name: "Dune Crash", img: "Dune_Crash.png" }
        ];

        let isGameOverCatalogFlow = false;

        function openGamesCatalog(fromGameOver = false) {
            isPaused = !fromGameOver;
            isGameOverCatalogFlow = fromGameOver;
            
            const list = document.getElementById('games-list');
            list.innerHTML = '';
            
            GAMES_CATALOG.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `<img src="${game.img}" class="game-img" alt="${game.name}" onerror="this.style.display='none'"><div class="game-title">${game.name}</div>`;
                card.onclick = () => {
                    if (window.vkBridge) {
                        vkBridge.send("VKWebAppOpenApp", { app_id: game.id, location: "catalog" })
                            .catch(error => console.error("Failed to open app:", error));
                    }
                };
                list.appendChild(card);
            });
            
            document.getElementById('games-modal').style.display = 'flex';
        }

        document.getElementById('close-games-btn').addEventListener('click', () => {
            document.getElementById('games-modal').style.display = 'none';
            if (!isGameOverCatalogFlow) isPaused = false;
        });

        const gamesBtn = document.getElementById('games-btn');
        if (gamesBtn) gamesBtn.addEventListener('click', () => openGamesCatalog(false));

    </script>
</body>
</html>
