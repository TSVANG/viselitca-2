<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Виселица - Бумажная Версия</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Рукописный шрифт для стиля фломастера -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none;
            touch-action: manipulation; position: fixed; width: 100%;
        }
        
        /* Бумажный фон в линеечку */
        .paper-bg {
            background-color: #fdf6e3;
            background-image: repeating-linear-gradient(transparent, transparent 31px, #cbd5e1 31px, #cbd5e1 32px);
            font-family: 'Caveat', cursive;
        }

        /* Стиль нарисованных от руки элементов */
        .drawn-box {
            border: 3px solid #1e293b;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background: #fff;
            box-shadow: 4px 4px 0px rgba(30, 41, 59, 0.15);
        }
        
        .drawn-btn {
            border: 3px solid #1e293b;
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            background: transparent;
            box-shadow: 3px 4px 0px rgba(30, 41, 59, 0.2);
            transition: all 0.1s;
        }
        .drawn-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(30, 41, 59, 0.2);
        }

        /* Цвета "Фломастеров" для кнопок */
        .marker-green { border-color: #16a34a; color: #14532d; background: rgba(34, 197, 94, 0.15); }
        .marker-yellow { border-color: #ca8a04; color: #713f12; background: rgba(234, 179, 8, 0.15); }
        .marker-orange { border-color: #ea580c; color: #7c2d12; background: rgba(249, 115, 22, 0.15); }
        .marker-red { border-color: #dc2626; color: #7f1d1d; background: rgba(239, 68, 68, 0.15); }
        .marker-purple { border-color: #9333ea; color: #4c1d95; background: rgba(168, 85, 247, 0.15); }
        .marker-blue { border-color: #2563eb; color: #1e3a8a; background: rgba(59, 130, 246, 0.15); }

        /* Клавиатура */
        .key-btn {
            border: 2px solid #475569;
            border-radius: 8px 12px 10px 8px / 12px 8px 10px 12px;
            background: #fff;
            transition: all 0.1s;
        }
        .key-correct {
            border-color: #16a34a; background: rgba(34, 197, 94, 0.2); color: #14532d; font-weight: bold;
        }
        .key-wrong {
            border-color: #94a3b8; background: transparent; color: #94a3b8; text-decoration: line-through;
        }

        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s ease; }
        .hide { display: none !important; }
        .fade-in { animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .locked-level { filter: grayscale(100%); opacity: 0.6; pointer-events: none; }

        /* Анимация обучения */
        @keyframes tut-press {
            0%, 100% { transform: scale(1); background: #fff; }
            50% { transform: scale(0.85); background: #e2e8f0; }
        }
        .anim-press { animation: tut-press 1s ease-in-out; }
    </style>
</head>
<body class="paper-bg flex flex-col items-center justify-center min-h-screen p-1 sm:p-2 text-slate-800" oncontextmenu="return false;">

    <!-- ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ (Toast) -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl z-[100] opacity-0 pointer-events-none -translate-y-10 transition-all duration-300 font-bold text-xl text-center min-w-[200px] border-2 border-slate-900" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;"></div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="fixed inset-0 paper-bg z-40 flex flex-col items-center justify-center p-4">
        <div id="main-menu-content" class="w-full max-w-sm flex flex-col gap-4 fade-in">
            <!-- Статистика -->
            <div class="flex justify-between items-center drawn-box p-3">
                <div class="flex items-center gap-2"><span class="text-2xl">💰</span><span id="menu-coins" class="font-bold text-2xl">5000</span></div>
                <div class="flex items-center gap-2"><span class="text-2xl">🏆</span><span id="menu-score" class="font-bold text-2xl">0</span></div>
            </div>

            <h1 class="text-6xl font-bold text-center my-2 tracking-tight text-slate-900" style="text-shadow: 2px 2px 0px rgba(0,0,0,0.1);">Виселица</h1>

            <!-- Кнопки уровней -->
            <div class="space-y-3 relative text-2xl">
                <button data-level="easy" onclick="game.init('easy')" class="w-full drawn-btn marker-green font-bold py-2 px-4 text-center">Легкий</button>
                
                <button data-level="medium" id="btn-lvl-medium" data-name="Средний" class="w-full drawn-btn marker-yellow font-bold py-2 px-4 locked-level flex justify-between items-center">
                    <span>Средний</span><span class="text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-medium">🔒 0/10</span>
                </button>

                <button data-level="hard" id="btn-lvl-hard" data-name="Сложный" class="w-full drawn-btn marker-orange font-bold py-2 px-4 locked-level flex justify-between items-center">
                    <span>Сложный</span><span class="text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-hard">🔒 0/10</span>
                </button>

                <button data-level="impossible" id="btn-lvl-impossible" data-name="Невозможный" class="w-full drawn-btn marker-red font-bold py-2 px-4 locked-level flex justify-between items-center">
                    <span>Невозможный</span><span class="text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-impossible">🔒 0/10</span>
                </button>

                <button data-level="random" id="btn-lvl-random" data-name="Бог рандома" class="w-full drawn-btn marker-purple font-bold py-2 px-4 locked-level flex justify-between items-center">
                    <span>Бог рандома</span><span class="text-lg bg-black/10 px-2 py-0.5 rounded-lg border border-slate-800" id="lock-random">🔒 0/10</span>
                </button>
            </div>

            <button id="btn-daily" class="w-full drawn-btn marker-blue font-bold py-2 px-4 text-2xl flex items-center justify-center gap-2 mt-2">
                <span>🌟 Слово Дня</span>
            </button>

            <!-- Нижняя панель иконок -->
            <div class="grid grid-cols-5 gap-2 mt-2">
                <button onclick="shop.open()" class="drawn-btn bg-white p-2 flex flex-col items-center justify-center"><span class="text-3xl">🛒</span></button>
                <button onclick="dict.open()" class="drawn-btn bg-white p-2 flex flex-col items-center justify-center"><span class="text-3xl">📚</span></button>
                <button onclick="pvp.open()" class="drawn-btn bg-white p-2 flex flex-col items-center justify-center"><span class="text-3xl">⚔️</span></button>
                <button onclick="ui.showLeaderboard()" class="drawn-btn bg-white p-2 flex flex-col items-center justify-center"><span class="text-3xl">🏅</span></button>
                <button onclick="ui.shareApp()" class="drawn-btn bg-white p-2 flex flex-col items-center justify-center"><span class="text-3xl">📤</span></button>
            </div>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="app-container" class="w-full max-w-md mx-auto flex flex-col h-full transition-all duration-300 hide z-10 relative">
        <header class="flex justify-between items-center mb-2 flex-shrink-0 w-full pt-2">
            <button onclick="ui.goToMenu()" class="w-12 h-12 drawn-btn bg-white flex items-center justify-center text-3xl pb-1">⬅</button>
            <div class="text-2xl font-bold bg-white border-2 border-slate-800 px-4 py-0.5 rounded-xl text-slate-800" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;" id="game-diff-label">УРОВЕНЬ</div>
            <div class="w-12 h-12 drawn-box bg-yellow-50 flex items-center justify-center font-bold text-xl text-yellow-800"><span id="game-coins-show">5k</span></div>
        </header>

        <main class="w-full flex flex-col items-center flex-grow justify-around min-h-0">
            <div id="hangman-container" class="w-full max-w-[240px] sm:max-w-xs aspect-square relative drawn-box bg-white/50"><canvas id="hangman-canvas" class="w-full h-full"></canvas></div>
            <div id="word-container" class="flex flex-wrap justify-center gap-x-1 sm:gap-x-1.5 gap-y-2 my-2 text-4xl font-bold tracking-widest uppercase"></div>
            <div id="keyboard" class="w-full flex flex-col items-center gap-2 mt-2 font-bold uppercase"></div>
            
            <div class="mt-4 w-full flex justify-center gap-6 px-4">
                <!-- Ластик -->
                <button onclick="game.useEraser()" class="w-16 h-16 drawn-btn marker-red flex items-center justify-center text-3xl relative">
                    🧽
                    <span id="eraser-count" class="absolute -top-2 -right-2 bg-slate-800 text-white text-lg px-2 rounded-full border-2 border-white">3</span>
                </button>
                <!-- Подсказка -->
                <button onclick="game.useHint()" class="w-16 h-16 drawn-btn marker-yellow flex items-center justify-center text-3xl relative">
                    💡
                    <span id="hint-count" class="absolute -top-2 -right-2 bg-slate-800 text-white text-lg px-2 rounded-full border-2 border-white">3000</span>
                </button>
            </div>
        </main>
    </div>

    <!-- МОДАЛКИ -->

    <!-- Продолжение игры (Синхронизация) -->
    <div id="modal-continue" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center p-4 z-[55] hide modal-overlay backdrop-blur-md">
        <div class="drawn-box p-8 text-center w-full max-w-sm modal-content bg-[#fdf6e3]">
            <span class="text-6xl block mb-2">💾</span>
            <h2 class="text-4xl font-bold mb-2 text-slate-900">Сохранение</h2>
            <p class="text-xl text-slate-700 mb-6">Найдена незаконченная игра. Хотите продолжить?</p>
            
            <div class="flex flex-col gap-3 text-2xl">
                <button onclick="game.resumeSaved()" class="w-full drawn-btn marker-green font-bold py-2 px-4">Продолжить</button>
                <button onclick="game.discardSaved()" class="w-full drawn-btn marker-red font-bold py-2 px-4">Начать заново</button>
            </div>
        </div>
    </div>
    
    <!-- Финал уровня -->
    <div id="modal-end" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box p-6 text-center w-full max-w-sm modal-content bg-[#fdf6e3]">
            <h2 id="modal-title" class="text-5xl font-bold mb-2"></h2>
            <p class="text-slate-600 text-xl font-bold mb-1">Слово было:</p>
            <p id="modal-word" class="text-4xl font-bold text-slate-900 mb-6 tracking-widest uppercase border-b-4 border-slate-800 inline-block px-4 pb-1" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;"></p>
            
            <div id="modal-rewards" class="flex justify-center gap-4 mb-6">
                <div class="drawn-btn marker-yellow px-4 py-1 text-2xl font-bold flex gap-2"><span>💰</span><span id="reward-coins">+0</span></div>
                <div class="drawn-btn marker-blue px-4 py-1 text-2xl font-bold flex gap-2"><span>🏆</span><span id="reward-score">+0</span></div>
            </div>

            <div class="flex flex-col gap-3 text-2xl">
                <button onclick="game.nextWord()" class="w-full drawn-btn marker-green font-bold py-2 px-4">Следующее слово 🚀</button>
                <button onclick="ui.goToMenu()" class="w-full drawn-btn border-slate-400 text-slate-600 font-bold py-2 px-4">В меню</button>
            </div>
        </div>
    </div>

    <!-- Открытие нового уровня -->
    <div id="modal-levelup" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center p-4 z-[55] hide modal-overlay backdrop-blur-md">
        <div class="drawn-box p-8 text-center w-full max-w-sm modal-content bg-[#fdf6e3]">
            <span class="text-6xl block mb-2">🎉</span>
            <h2 class="text-4xl font-bold mb-2 text-slate-900">Новый уровень!</h2>
            <p class="text-2xl text-slate-700 mb-6">Открыта сложность:<br><span id="levelup-name" class="text-4xl text-blue-600 font-bold underline"></span></p>
            
            <div class="flex flex-col gap-3 text-2xl">
                <button id="btn-goto-new" class="w-full drawn-btn marker-blue font-bold py-2 px-4">Перейти туда!</button>
                <button id="btn-stay-old" class="w-full drawn-btn border-slate-400 text-slate-600 font-bold py-2 px-4">Остаться здесь</button>
            </div>
        </div>
    </div>

    <!-- Магазин (Скины и Бусты) -->
    <div id="modal-shop" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box w-full max-w-md h-[80vh] flex flex-col overflow-hidden modal-content bg-[#fdf6e3] relative">
            <button onclick="ui.closeModal('modal-shop')" class="absolute top-2 right-2 text-2xl pb-1 w-10 h-10 drawn-btn marker-red bg-white z-10">✖</button>
            <div class="p-4 border-b-4 border-slate-800 flex justify-between items-center bg-white" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;">
                <h2 class="text-4xl font-bold ml-2">Магазин</h2>
                <div class="text-2xl font-bold text-yellow-700 mr-10 bg-yellow-100 px-3 py-0.5 drawn-box">💰 <span id="shop-coins">0</span></div>
            </div>
            
            <div class="flex border-b-4 border-slate-800 text-xl font-bold bg-white">
                <button onclick="shop.switchTab('skins')" id="tab-skins" class="flex-1 py-2 text-blue-600 border-r-4 border-slate-800">Скины</button>
                <button onclick="shop.switchTab('boosts')" id="tab-boosts" class="flex-1 py-2 text-slate-500">Бусты</button>
            </div>

            <div class="flex-grow overflow-y-auto p-4 paper-bg" id="shop-content">
                <!-- Контент генерируется JS -->
            </div>
        </div>
    </div>

    <!-- Словарь -->
    <div id="modal-dict" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box w-full max-w-md h-[70vh] flex flex-col overflow-hidden modal-content bg-[#fdf6e3] relative">
            <button onclick="ui.closeModal('modal-dict')" class="absolute top-2 right-2 text-2xl pb-1 w-10 h-10 drawn-btn marker-red bg-white z-10">✖</button>
            <div class="p-4 border-b-4 border-slate-800 bg-white" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;">
                <h2 class="text-4xl font-bold">Словарь</h2>
                <p class="text-xl text-slate-600">Отгадано: <span id="dict-count" class="font-bold text-blue-600">0</span></p>
            </div>
            <div class="flex-grow overflow-y-auto p-4 flex flex-wrap gap-3 content-start paper-bg text-2xl uppercase" id="dict-list"></div>
        </div>
    </div>

    <!-- Вызов другу (PVP) -->
    <div id="modal-pvp" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 hide modal-overlay backdrop-blur-sm">
        <div class="drawn-box p-6 sm:p-8 text-center w-full max-w-sm modal-content bg-[#fdf6e3] relative">
            <button onclick="ui.closeModal('modal-pvp')" class="absolute top-2 right-2 text-2xl pb-1 w-10 h-10 drawn-btn marker-red bg-white">✖</button>
            <h2 class="text-4xl font-bold mb-2">Вызов! ⚔️</h2>
            <p class="text-xl text-slate-600 mb-4 leading-tight">Загадай слово и отправь ссылку другу!</p>
            <input type="text" id="pvp-input" maxlength="15" placeholder="СЛОВО..." class="w-full bg-white drawn-box px-4 py-2 text-3xl font-bold text-center uppercase tracking-widest mb-6 outline-none">
            <button onclick="pvp.createLink()" class="w-full drawn-btn marker-blue font-bold py-2 px-4 text-2xl">Сгенерировать ссылку</button>
        </div>
    </div>

    <!-- Обучение (Анимированное) -->
    <div id="tutorial-modal" class="fixed inset-0 bg-slate-900/80 flex flex-col items-center justify-center p-4 z-[60] hide modal-overlay backdrop-blur-sm">
        <div id="tut-content-box" class="drawn-box p-6 w-full max-w-sm text-center relative modal-content bg-[#fdf6e3]">
            <h3 class="text-4xl font-bold mb-2">Как играть?</h3>
            <div class="h-16 flex items-center justify-center text-slate-800 text-2xl font-bold mb-2 px-2 leading-tight" id="tut-text"></div>
            
            <div class="w-full max-w-[200px] mx-auto aspect-square relative drawn-box bg-white/50 mb-4"><canvas id="tut-canvas" class="w-full h-full"></canvas></div>
            
            <div id="tut-word" class="flex justify-center gap-2 text-4xl font-bold mb-4 uppercase"></div>
            
            <div class="flex justify-center gap-2 mb-6 text-2xl font-bold">
                <div id="tut-k-А" class="w-10 h-10 border-2 border-slate-800 bg-white rounded-lg flex items-center justify-center pb-1">А</div>
                <div id="tut-k-Б" class="w-10 h-10 border-2 border-slate-800 bg-white rounded-lg flex items-center justify-center pb-1">Б</div>
                <div id="tut-k-В" class="w-10 h-10 border-2 border-slate-800 bg-white rounded-lg flex items-center justify-center pb-1">В</div>
            </div>

            <button onclick="tutorial.end()" id="tut-btn-close" class="w-full drawn-btn marker-green font-bold py-2 px-4 text-2xl hide">Понятно, Играть!</button>
        </div>
    </div>

    <script>
        const APP_ID = 54053077; // ID игры для PVP
        
        const elements = {
            mainMenu: document.getElementById('main-menu'), appContainer: document.getElementById('app-container'),
            canvas: document.getElementById('hangman-canvas'), wordContainer: document.getElementById('word-container'), keyboardContainer: document.getElementById('keyboard'),
            hintButton: document.getElementById('hint-button'), hintCountEl: document.getElementById('hint-count'),
            eraserButton: document.getElementById('eraser-button'), eraserCountEl: document.getElementById('eraser-count'),
            menuCoins: document.getElementById('menu-coins'), menuScore: document.getElementById('menu-score'),
            gameCoinsShow: document.getElementById('game-coins-show'), gameDiffLabel: document.getElementById('game-diff-label')
        };
        const ctx = elements.canvas.getContext('2d');
        const tutCtx = document.getElementById('tut-canvas').getContext('2d');

        // База слов 
        const words = { 
            "4": ["БАБА", "БАЗА", "ВРАЧ", "МИНА", "РЕКА"],
            "5": ["АББАТ", "АБЗАЦ", "АБОРТ", "АВАНС"],
            "6": ["ОХРАНА", "ОЦЕНКА", "ОШИБКА", "ПАЛАТА","СУДЬБА", "СУИЦИД", "ТАЛАНТ","ЦЕНЗОР", "ЧТЕНИЕ", "ШАЙТАН", "ЯНВАРЬ"],
            "7": ["АВТОБУС","ДЕСЯТОК", "ДЕТСТВО", "ДОГОВОР", "ДЫХАНИЕ", "ЕДИНИЦА","ЭЛЕМЕНТ", "ЭНЕРГИЯ", "ЯВЛЕНИЕ"],
            "8": ["ОЩУЩЕНИЕ", "ПАМЯТНИК", "ПЛОЩАДКА", "ПОЛИТИКА","ПРАКТИКА", "ПРЕПАРАТ","ЧИТАТЕЛЬ"],
            "9": ["АТМОСФЕРА", "ВЫРАЖЕНИЕ", "ГОСТИНИЦА", "СТРУКТУРА","ТЕНДЕНЦИЯ","ЧЕМПИОНАТ", "ЭКОНОМИКА"],
            "10": ["АВТОМОБИЛЬ", "АКТИВНОСТЬ", "АМЕРИКАНЕЦ", "БИБЛИОТЕКА","УПРАВЛЕНИЕ","ФОТОГРАФИЯ"],
            "11": ["БОЛЬШИНСТВО", "ВОЗВРАЩЕНИЕ", "ВОЗДЕЙСТВИЕ", "УНИВЕРСИТЕТ", "ЭКСПЕРИМЕНТ"] 
        };
        
        const keyboardLayout = ['ЙЦУКЕНГШЩЗХЪ', 'ФЫВАПРОЛДЖЭ', 'ЯЧСМИТЬБЮ'];
        
        // Стартовые параметры
        let pData = { coins: 5000, score: 0, stats: { easy: 0, medium: 0, hard: 0, impossible: 0, random: 0, daily: 0 }, dict: [], skins: [0], equippedSkin: 0, hints: 3000, erasers: 3, tut: false, plays: 0, lastDaily: '', freeChest: '', adChests: 0, adChestDate: '', hintsUpgraded: false, activeGame: null };
        let currentWord = '', guessedLetters = [], wrongGuesses = 0, difficulty = 'easy', isPvp = false, gameActive = false, statsBeforeGame = {};
        const MAX_ERRORS = 8;
        
        // --- VK BRIDGE ВЗАИМОДЕЙСТВИЕ ---
        const vk = {
            init: async () => {
                vkBridge.send('VKWebAppInit');
                
                // Подписка на обновление баннера, чтобы не перекрывать нижнюю часть экрана
                vkBridge.subscribe((e) => {
                    if (e.detail.type === 'VKWebAppBannerAdUpdated') {
                        const h = e.detail.data.height || 60;
                        document.body.style.paddingBottom = `${h}px`;
                    }
                });

                // Вызов баннера при старте
                vk.showBanner();

                await Promise.race([
                    new Promise(res => {
                        vkBridge.send('VKWebAppStorageGet', { keys: ['pData'] }).then(d => { 
                            if (d.keys && d.keys[0].value) {
                                const loadedData = JSON.parse(d.keys[0].value);
                                pData = { ...pData, ...loadedData };
                                pData.stats = { easy: 0, medium: 0, hard: 0, impossible: 0, random: 0, daily: 0, ...(loadedData.stats || {}) };
                                if(pData.erasers === undefined) pData.erasers = 3;
                                
                                if (!pData.hintsUpgraded) {
                                    pData.hints = 3000;
                                    pData.hintsUpgraded = true;
                                }
                            } else {
                                pData.hintsUpgraded = true;
                            }
                            res(); 
                        }).catch(() => res());
                    }),
                    new Promise(res => setTimeout(res, 800))
                ]);
                
                ui.updateMenuStats();
                ui.updateCoins();
                
                try {
                    const hash = window.location.hash;
                    if(hash.startsWith('#pvp=')) { 
                        const w = decodeURIComponent(escape(atob(hash.split('=')[1]))); 
                        pvp.start(w); return; 
                    }
                } catch(e) {}
                
                if (!pData.tut) {
                    tutorial.start();
                } else if (pData.activeGame && pData.activeGame.currentWord) {
                    // Предлагаем продолжить, если есть незаконченная игра
                    ui.openModal('modal-continue');
                } else {
                    ui.showMenu();
                }
            },
            save: () => { try { vkBridge.send('VKWebAppStorageSet', { key: 'pData', value: JSON.stringify(pData) }); } catch(e){} },
            showBanner: () => vkBridge.send('VKWebAppShowBannerAd', { banner_location: 'bottom' }).catch(()=>{}),
            showInterstitial: () => vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' }).catch(()=>{}),
            showReward: async () => { try { const d = await vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' }); return d.result; } catch(e) { return false; } }
        };

        // Сохранение состояния при уходе со вкладки
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') vk.save(); });

        // --- ЛОГИКА ИГРЫ ---
        const game = {
            init: (diff) => {
                difficulty = diff; isPvp = false; gameActive = true;
                wrongGuesses = 0; guessedLetters = [];
                statsBeforeGame = JSON.parse(JSON.stringify(pData.stats)); 
                
                ui.closeAllModals();
                elements.mainMenu.classList.add('hide'); elements.appContainer.classList.remove('hide');
                
                if (diff === 'daily') { pData.lastDaily = new Date().toISOString().split('T')[0]; vk.save(); }
                
                let pool = [];
                if (diff === 'easy') pool = [...(words["4"]||[]), ...(words["5"]||[])];
                else if (diff === 'medium') pool = [...(words["6"]||[]), ...(words["7"]||[])];
                else if (diff === 'hard') pool = [...(words["8"]||[]), ...(words["9"]||[])];
                else if (diff === 'impossible') pool = [...(words["10"]||[]), ...(words["11"]||[])];
                else pool = Object.values(words).flat();
                
                currentWord = pool[Math.floor(Math.random() * pool.length)];
                game.setupUI();
                game.saveGameState(); // Сразу сохраняем начало
            },
            resumeSaved: () => {
                ui.closeModal('modal-continue');
                const saved = pData.activeGame;
                if (!saved) { ui.showMenu(); return; }
                
                difficulty = saved.difficulty;
                isPvp = saved.isPvp;
                currentWord = saved.currentWord;
                guessedLetters = saved.guessedLetters || [];
                wrongGuesses = saved.wrongGuesses || 0;
                gameActive = true;
                statsBeforeGame = JSON.parse(JSON.stringify(pData.stats)); 
                
                elements.mainMenu.classList.add('hide');
                elements.appContainer.classList.remove('hide');
                game.setupUI();
                draw.hangman(ctx, wrongGuesses);
            },
            discardSaved: () => {
                pData.activeGame = null;
                vk.save();
                ui.closeModal('modal-continue');
                ui.showMenu();
            },
            saveGameState: () => {
                if (gameActive && currentWord) {
                    pData.activeGame = { currentWord, guessedLetters, wrongGuesses, difficulty, isPvp, ts: Date.now() };
                    vk.save();
                }
            },
            setupUI: () => {
                const labels = {'easy': "ЛЕГКИЙ", 'medium': "СРЕДНИЙ", 'hard': "СЛОЖНЫЙ", 'impossible': "НЕВОЗМОЖНЫЙ", 'random': "РАНДОМ"};
                elements.gameDiffLabel.textContent = isPvp ? "ВЫЗОВ" : difficulty === 'daily' ? "СЛОВО ДНЯ" : labels[difficulty];
                
                ui.updateCoins();
                elements.hintCountEl.textContent = pData.hints;
                elements.eraserCountEl.textContent = pData.erasers;
                ui.displayWord(); ui.createKeyboard(); draw.resizeCanvas();
            },
            handleGuess: (letter) => {
                if (!gameActive || guessedLetters.includes(letter)) return;
                guessedLetters.push(letter);
                const btn = document.getElementById(`key-${letter}`); btn.disabled = true;
                if (currentWord.includes(letter)) {
                    btn.classList.add('key-correct'); btn.classList.remove('text-slate-800');
                    ui.displayWord();
                } else {
                    wrongGuesses++; 
                    btn.classList.add('key-wrong'); btn.classList.remove('text-slate-800');
                    draw.hangman(ctx, wrongGuesses);
                    if (wrongGuesses >= MAX_ERRORS) game.end(false);
                }
                game.saveGameState(); // Сохраняем после каждого хода
            },
            useHint: () => {
                if (!gameActive) return;
                if (pData.hints <= 0) { 
                    ui.showNotification("Закончились! Загляни в магазин 🛒");
                    setTimeout(() => { shop.open(); shop.switchTab('boosts'); }, 800);
                    return; 
                }
                const unguessed = currentWord.split('').filter(l => !guessedLetters.includes(l));
                if (unguessed.length === 0) return;
                pData.hints--; elements.hintCountEl.textContent = pData.hints;
                game.handleGuess(unguessed[Math.floor(Math.random() * unguessed.length)]);
            },
            useEraser: () => {
                if (!gameActive) return;
                if (wrongGuesses <= 0) { ui.showNotification("Ошибок пока нет! 😉"); return; }
                if (pData.erasers <= 0) { 
                    ui.showNotification("Закончились! Загляни в магазин 🛒");
                    setTimeout(() => { shop.open(); shop.switchTab('boosts'); }, 800);
                    return; 
                }
                
                pData.erasers--; wrongGuesses--; 
                elements.eraserCountEl.textContent = pData.erasers;
                draw.hangman(ctx, wrongGuesses);
                game.saveGameState();
                ui.showNotification("Ошибка стёрта! 🧽");
            },
            end: (isWin) => {
                gameActive = false; pData.plays++;
                pData.activeGame = null; // Очищаем сессию, так как уровень пройден
                let c = 0, s = 0;
                
                if (isWin) {
                    c = currentWord.length * 2 + (MAX_ERRORS - wrongGuesses) * 3;
                    s = currentWord.length * 5;
                    if(difficulty === 'daily') { c*=3; s*=3; }
                    pData.coins += c; pData.score += s;
                    if(!isPvp && difficulty !== 'daily') pData.stats[difficulty]++;
                    if(!pData.dict.includes(currentWord)) pData.dict.push(currentWord);
                }
                vk.save(); ui.updateCoins();

                setTimeout(() => {
                    let newlyUnlocked = null;
                    if (!isPvp && difficulty !== 'daily' && isWin) {
                        if (difficulty === 'easy' && statsBeforeGame.easy < 10 && pData.stats.easy >= 10) newlyUnlocked = 'medium';
                        if (difficulty === 'medium' && statsBeforeGame.medium < 10 && pData.stats.medium >= 10) newlyUnlocked = 'hard';
                        if (difficulty === 'hard' && statsBeforeGame.hard < 10 && pData.stats.hard >= 10) newlyUnlocked = 'impossible';
                        if (difficulty === 'impossible' && statsBeforeGame.impossible < 10 && pData.stats.impossible >= 10) newlyUnlocked = 'random';
                    }

                    // Интерстициальная реклама каждые 10 слов
                    if (pData.plays > 0 && pData.plays % 10 === 0) {
                        vk.showInterstitial();
                    }

                    if (newlyUnlocked) {
                        const names = {'medium': 'Средний', 'hard': 'Сложный', 'impossible': 'Невозможный', 'random': 'Бог Рандома'};
                        document.getElementById('levelup-name').textContent = names[newlyUnlocked];
                        document.getElementById('btn-goto-new').onclick = () => { ui.closeModal('modal-levelup'); game.init(newlyUnlocked); };
                        document.getElementById('btn-stay-old').onclick = () => { ui.closeModal('modal-levelup'); game.init(difficulty); };
                        ui.openModal('modal-levelup');
                    } else {
                        document.getElementById('modal-title').textContent = isWin ? 'Победа! 🎉' : 'Увы... 💀';
                        document.getElementById('modal-title').className = isWin ? 'text-5xl font-bold mb-2 text-green-600' : 'text-5xl font-bold mb-2 text-red-600';
                        document.getElementById('modal-word').textContent = currentWord;
                        document.getElementById('reward-coins').textContent = `+${c}`;
                        document.getElementById('reward-score').textContent = `+${s}`;
                        ui.openModal('modal-end');
                    }
                    ui.updateMenuStats();
                }, 800);
            },
            nextWord: () => {
                ui.closeModal('modal-end');
                if (isPvp || difficulty === 'daily') ui.goToMenu(); 
                else game.init(difficulty);
            }
        };

        // --- ОТРИСОВКА (CANVAS) В СТИЛЕ ФЛОМАСТЕРА ---
        const draw = {
            resizeCanvas: () => {
                const c = elements.canvas.parentElement; const s = Math.min(c.clientWidth, c.clientHeight);
                elements.canvas.width = s; elements.canvas.height = s;
                draw.hangman(ctx, wrongGuesses);
            },
            hangman: (context, errors) => {
                const w = context.canvas.width, h = context.canvas.height;
                context.clearRect(0, 0, w, h); 
                context.lineCap = 'round'; context.lineJoin = 'round';
                
                context.strokeStyle = '#1e293b'; 
                context.lineWidth = w * 0.035; 
                context.beginPath();
                
                const cX = w * 0.65, hY = h * 0.35, r = w * 0.06;

                if (errors > 0) { // 1
                    context.moveTo(w * 0.1, h * 0.95); context.lineTo(w * 0.9, h * 0.95);
                    context.moveTo(w * 0.3, h * 0.95); context.lineTo(w * 0.3, h * 0.1);
                }
                if (errors > 1) { // 2
                    context.moveTo(w * 0.3, h * 0.1); context.lineTo(w * 0.65, h * 0.1);
                    context.moveTo(w * 0.3, h * 0.25); context.lineTo(w * 0.45, h * 0.1);
                }
                if (errors > 2) { // 3
                    context.moveTo(w * 0.65, h * 0.1); context.lineTo(w * 0.65, hY - r);
                    context.stroke(); context.beginPath(); 
                    context.arc(cX, hY, r, 0, Math.PI * 2);
                }
                if (errors > 3) { // 4
                    context.moveTo(cX, hY + r); context.lineTo(cX, hY + r + h * 0.25);
                }
                if (errors > 4) { // 5
                    context.moveTo(cX, hY + r + h * 0.05); context.lineTo(cX - w * 0.12, hY + r + h * 0.15);
                }
                if (errors > 5) { // 6
                    context.moveTo(cX, hY + r + h * 0.05); context.lineTo(cX + w * 0.12, hY + r + h * 0.15);
                }
                if (errors > 6) { // 7
                    context.moveTo(cX, hY + r + h * 0.25); context.lineTo(cX - w * 0.1, hY + r + h * 0.4);
                }
                if (errors > 7) { // 8
                    context.moveTo(cX, hY + r + h * 0.25); context.lineTo(cX + w * 0.1, hY + r + h * 0.4);
                }
                context.stroke();

                if (errors > 2 && pData.equippedSkin > 0 && context === ctx) {
                    const skinMap = {0:'👤', 1:'🧢', 2:'🎩', 3:'👑', 4:'🕶️', 5:'🎀', 6:'😎', 9:'👽'};
                    context.font = `${r*2.5}px Arial`; context.textAlign = 'center'; context.textBaseline = 'middle';
                    const offset = [4, 6, 9].includes(pData.equippedSkin) ? 0 : -r; 
                    context.fillText(skinMap[pData.equippedSkin], cX, hY + offset);
                }
            }
        };

        // --- UI ФУНКЦИИ ---
        const ui = {
            showNotification: (msg) => {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.remove('opacity-0', '-translate-y-10'); t.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => { t.classList.remove('opacity-100', 'translate-y-0'); t.classList.add('opacity-0', '-translate-y-10'); }, 2500);
            },
            updateCoins: () => {
                elements.menuCoins.textContent = pData.coins; elements.gameCoinsShow.textContent = pData.coins >= 1000 ? (pData.coins/1000).toFixed(1)+'k' : pData.coins;
                const shopCoins = document.getElementById('shop-coins'); if (shopCoins) shopCoins.textContent = pData.coins;
            },
            showMenu: () => {
                ui.closeAllModals(); elements.appContainer.classList.add('hide'); elements.mainMenu.classList.remove('hide'); ui.updateMenuStats();
            },
            goToMenu: () => { gameActive = false; ui.showMenu(); },
            
            updateMenuStats: () => {
                elements.menuScore.textContent = pData.score;
                const checkLvl = (id, req) => {
                    const btn = document.getElementById(`btn-lvl-${id}`); 
                    const lck = document.getElementById(`lock-${id}`);
                    if (!btn) return;
                    if (req >= 10) { 
                        btn.classList.remove('locked-level', 'flex', 'justify-between'); 
                        btn.classList.add('block', 'text-center'); 
                        if(lck) lck.classList.add('hide'); 
                        btn.onclick = () => game.init(id); 
                    } else { 
                        btn.classList.add('locked-level', 'flex', 'justify-between'); 
                        btn.classList.remove('block', 'text-center');
                        if(lck) { lck.classList.remove('hide'); lck.textContent = `🔒 ${req}/10`; }
                        btn.onclick = null; 
                    }
                };
                checkLvl('medium', pData.stats.easy);
                checkLvl('hard', pData.stats.medium);
                checkLvl('impossible', pData.stats.hard);
                checkLvl('random', pData.stats.impossible);
                
                const dBtn = document.getElementById('btn-daily');
                if(pData.lastDaily === new Date().toISOString().split('T')[0]) { dBtn.classList.add('locked-level', 'opacity-50'); dBtn.textContent = '🌟 Жди завтра'; dBtn.onclick=null; }
                else { dBtn.classList.remove('locked-level', 'opacity-50'); dBtn.innerHTML = '🌟 Слово Дня'; dBtn.onclick=()=>game.init('daily'); }
            },
            displayWord: () => {
                const lh = 'h-10 sm:h-12';
                // Вместо отдельного div, используем надежный классический border-b-4 (нижнюю границу), которая не "ломается" на GitHub
                elements.wordContainer.innerHTML = currentWord.split('').map(l => 
                    `<div class="flex flex-col items-center justify-center ${lh} w-6 sm:w-8 border-b-4 border-slate-800 mx-0.5 sm:mx-1 mb-2">
                        <span class="text-slate-900 text-3xl sm:text-4xl font-bold leading-none pb-1">${guessedLetters.includes(l) ? l : '&nbsp;'}</span>
                    </div>`
                ).join('');
                if (gameActive && currentWord.split('').every(l => guessedLetters.includes(l))) game.end(true);
            },
            createKeyboard: () => {
                elements.keyboardContainer.innerHTML = '';
                keyboardLayout.forEach(row => {
                    const rowDiv = document.createElement('div'); rowDiv.className = 'flex justify-center gap-1.5 w-full';
                    row.split('').forEach(key => {
                        const btn = document.createElement('button'); btn.textContent = key; btn.id = `key-${key}`;
                        btn.className = 'key-btn text-slate-800 h-10 w-[8.5%] max-w-[2.5rem] flex items-center justify-center pb-1 active:scale-90';
                        btn.onclick = () => game.handleGuess(key);
                        if (guessedLetters.includes(key)) {
                            btn.disabled = true;
                            if (currentWord.includes(key)) { btn.classList.add('key-correct'); btn.classList.remove('text-slate-800'); } 
                            else { btn.classList.add('key-wrong'); btn.classList.remove('text-slate-800'); }
                        }
                        rowDiv.appendChild(btn);
                    }); elements.keyboardContainer.appendChild(rowDiv);
                });
            },
            openModal: id => { document.getElementById(id).classList.remove('hide'); },
            closeModal: id => { document.getElementById(id).classList.add('hide'); },
            closeAllModals: () => { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hide')); },
            shareApp: () => vkBridge.send('VKWebAppShare', { link: "https://vk.com/app" + APP_ID }),
            showLeaderboard: () => vkBridge.send("VKWebAppShowLeaderBoardBox", {user_result: pData.score}).catch(()=>ui.showNotification("Сначала набери очки!"))
        };

        // --- МАГАЗИН ---
        const shop = {
            open: () => { ui.openModal('modal-shop'); shop.switchTab('skins'); ui.updateCoins(); },
            switchTab: (tab) => {
                // Вкладка Сундук удалена, оставлены только 2: Скины и Бусты
                ['skins','boosts'].forEach(t => {
                    document.getElementById(`tab-${t}`).className = t===tab ? 'flex-1 py-2 text-blue-600 border-r-4 border-slate-800 bg-blue-50' : 'flex-1 py-2 text-slate-500 border-r-4 border-slate-800 bg-white';
                });
                document.getElementById('tab-boosts').classList.remove('border-r-4');
                const c = document.getElementById('shop-content'); c.innerHTML = '';
                
                if(tab === 'skins') {
                    const grid = document.createElement('div'); grid.className = 'grid grid-cols-3 gap-3';
                    const skinMap = {0:['👤',0], 1:['🧢',200], 2:['🎩',300], 3:['👑',1000], 4:['🕶️',250], 5:['🎀',250], 6:['😎',400], 9:['👽',900]};
                    for(let i of [0, 1, 2, 3, 4, 5, 6, 9]) {
                        const owns = pData.skins.includes(i) || i === 0; const eq = pData.equippedSkin === i; const price = skinMap[i][1];
                        grid.innerHTML += `<div class="drawn-box bg-white p-2 flex flex-col items-center skin-card ${eq?'border-blue-600 bg-blue-50':''}" onclick="shop.handleSkin(${i}, ${price})">
                            <span class="text-5xl my-2">${skinMap[i][0]}</span>
                            ${i === 0 && !eq ? '<span class="text-sm font-bold text-slate-500 bg-slate-100 px-2 rounded">БАЗОВЫЙ</span>' : ''}
                            ${owns ? (eq ? '<span class="text-sm font-bold text-white bg-blue-600 px-2 rounded">НАДЕТО</span>' : (i !== 0 ? '<span class="text-sm font-bold text-slate-600 border-2 border-slate-300 px-2 rounded">НАДЕТЬ</span>' : '')) : `<span class="text-sm font-bold text-yellow-800 bg-yellow-200 border-2 border-yellow-400 px-2 rounded w-full text-center">💰 ${price}</span>`}
                        </div>`;
                    }
                    c.appendChild(grid);
                } else if(tab === 'boosts') {
                    const today = new Date().toISOString().split('T')[0];
                    if (pData.adChestDate !== today) { pData.adChests = 0; pData.freeChest = ''; pData.adChestDate = today; vk.save(); }
                    const freeAv = pData.freeChest !== today; const adsAv = pData.adChests < 3;
                    
                    // Сундук теперь находится вверху вкладки бустов
                    c.innerHTML = `
                    <div class="text-center py-4 drawn-box bg-white mb-6">
                        <span class="text-7xl block mb-2">🎁</span>
                        <h3 class="font-bold text-3xl mb-1">Сундук удачи</h3>
                        <p class="text-lg text-slate-500 mb-6 leading-tight">Монеты, ластики или подсказки!</p>
                        ${freeAv ? `<button onclick="shop.openChest('free')" class="w-[90%] mx-auto drawn-btn marker-green font-bold py-2 text-2xl mb-3 block">Открыть БЕСПЛАТНО</button>` : ''}
                        ${!freeAv && adsAv ? `<button onclick="shop.openChest('ad')" class="w-[90%] mx-auto drawn-btn marker-blue font-bold py-2 text-xl mb-3 flex justify-center items-center gap-2"><span>Реклама за награду</span><span class="text-sm bg-black/10 px-2 py-0.5 rounded border border-slate-400">Ост: ${3-pData.adChests}</span></button>` : ''}
                        ${!freeAv && !adsAv ? `<p class="text-red-600 font-bold bg-red-50 py-2 border-2 border-red-200 mx-4" style="border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;">Сундуки закончились</p>` : ''}
                    </div>
                    
                    <div class="space-y-4">
                        <div class="drawn-box bg-white p-4 flex items-center justify-between">
                            <div class="flex items-center gap-3"><div class="text-4xl">💡</div><div class="leading-none"><p class="font-bold text-2xl">Подсказка</p><p class="text-sm text-slate-500">Откроет 1 букву</p></div></div>
                            <button onclick="shop.buyBoost('hint')" class="drawn-btn marker-yellow px-4 py-1 text-xl font-bold">💰 50</button>

                    </div>`;

            },
            handleSkin: (id, price) => {
                if(id === 0 || pData.skins.includes(id)) { pData.equippedSkin = id; }
                else if(pData.coins >= price) { pData.coins -= price; pData.skins.push(id); pData.equippedSkin = id; ui.showNotification("Скин куплен! 🎉"); }
                else { ui.showNotification("Мало монет! 💰"); return; }
                vk.save(); ui.updateCoins(); shop.switchTab('skins'); if(gameActive) draw.hangman(ctx, wrongGuesses);

            buyBoost: (type) => {

                    vk.save(); ui.updateCoins(); shop.switchTab('boosts'); elements.hintCountEl.textContent = pData.hints; elements.eraserCountEl.textContent = pData.erasers; ui.showNotification("Куплено! 🛒");
                } else { ui.showNotification("Мало монет! 💰"); }

            }
        };

        // --- АНИМИРОВАННОЕ ОБУЧЕНИЕ ---
        const tutorial = {
            active: false,
            start: async () => {
                tutorial.active = true;
                ui.openModal('tutorial-modal');
                document.getElementById('tut-btn-close').classList.remove('hide');
                
                const c = document.getElementById('tut-canvas'); 
                const s = Math.min(c.parentElement.clientWidth, c.parentElement.clientHeight, 200);
                c.width = s; c.height = s;
                
                const setWord = (str) => { 
                    document.getElementById('tut-word').innerHTML = str.split('').map(l => 
                        `<div class="flex items-center justify-center h-10 w-6 border-b-4 border-slate-800 mx-0.5 mb-2"><span class="leading-none text-slate-900 pb-1 font-bold">${l === ' ' ? '&nbsp;' : l}</span></div>`
                    ).join(''); 
                };
                
                const pressKey = (id, type) => {
                    const k = document.getElementById(`tut-k-${id}`);
                    k.classList.add('anim-press');
                    setTimeout(() => {
                        k.classList.remove('anim-press');
                        if(type === 'correct') { k.className = 'w-10 h-10 border-2 border-green-600 bg-green-200 text-green-900 rounded-lg flex items-center justify-center pb-1 font-bold'; }
                        if(type === 'wrong') { k.className = 'w-10 h-10 border-2 border-slate-400 bg-transparent text-slate-400 rounded-lg flex items-center justify-center pb-1 line-through'; }
                    }, 400);
                };

                let pointer = document.getElementById('tut-pointer');
                if(!pointer) {
                    pointer = document.createElement('div');
                    pointer.id = 'tut-pointer';
                    pointer.innerHTML = '👇';
                    pointer.className = 'absolute text-5xl transition-all duration-500 ease-in-out z-[70] opacity-0';
                    pointer.style.pointerEvents = 'none';
                    document.getElementById('tut-content-box').appendChild(pointer);
                }
                
                const movePointer = async (targetId, offX=0, offY=0) => {
                    const target = document.getElementById(targetId);
                    const modal = document.getElementById('tut-content-box');
                    if(!target || !modal) return;
                    const rect = target.getBoundingClientRect();
                    const mRect = modal.getBoundingClientRect();
                    pointer.style.left = (rect.left - mRect.left + rect.width/2 - 20 + offX) + 'px';
                    pointer.style.top = (rect.top - mRect.top + rect.height/2 + offY) + 'px';
                    pointer.style.opacity = '1';
                    await new Promise(r => setTimeout(r, 600));
                };

                const tapPointer = async () => {
                    pointer.style.transform = 'scale(0.7)';
                    await new Promise(r => setTimeout(r, 200));
                    pointer.style.transform = 'scale(1)';
                    await new Promise(r => setTimeout(r, 200));
                };

                const txt = document.getElementById('tut-text');
                
                while(tutorial.active) {
                    draw.hangman(tutCtx, 0); 
                    setWord('    '); 
                    document.querySelectorAll('[id^="tut-k-"]').forEach(k => k.className = 'w-10 h-10 border-2 border-slate-800 bg-white rounded-lg flex items-center justify-center pb-1 text-slate-800');
                    pointer.style.opacity = '0';
                    
                    txt.innerHTML = "Твоя цель &mdash; <span class='text-green-600'>разгадать слово!</span>"; 
                    await new Promise(r => setTimeout(r, 1000)); if(!tutorial.active) break;
                    
                    txt.textContent = "Выбирай буквы на клавиатуре...";
                    await movePointer('tut-k-А');
                    if(!tutorial.active) break;
                    
                    await tapPointer();
                    pressKey('А', 'correct'); 
                    await new Promise(r => setTimeout(r, 400));
                    setWord('   А');
                    txt.innerHTML = "Верно! <span class='text-green-600'>Буква на месте.</span>"; 
                    await new Promise(r => setTimeout(r, 2000)); if(!tutorial.active) break;
                    
                    txt.textContent = "А если ошибиться?"; 
                    await movePointer('tut-k-Б');
                    if(!tutorial.active) break;
                    
                    await tapPointer();
                    pressKey('Б', 'wrong'); 
                    await new Promise(r => setTimeout(r, 400));
                    
                    for(let i=1; i<=4; i++) {
                        draw.hangman(tutCtx, i);
                        await new Promise(r => setTimeout(r, 150));
                    }
                    txt.innerHTML = "За ошибку <span class='text-red-600'>рисуем деталь...</span>"; 
                    await new Promise(r => setTimeout(r, 2000)); if(!tutorial.active) break;
                    
                    await movePointer('tut-k-В');
                    if(!tutorial.active) break;
                    
                    await tapPointer();
                    pressKey('В', 'wrong'); 
                    await new Promise(r => setTimeout(r, 400));
                    
                    pointer.style.opacity = '0'; 
                    for(let i=5; i<=8; i++) {
                        draw.hangman(tutCtx, i);
                        await new Promise(r => setTimeout(r, 150));
                    }
                    txt.innerHTML = "<span class='text-red-600'>8 ошибок</span> &mdash; и ты проиграл!";
                    await new Promise(r => setTimeout(r, 3500));
                }
            },
            end: () => { tutorial.active = false; pData.tut = true; vk.save(); ui.closeModal('tutorial-modal'); ui.showMenu(); }
        };

        const pvp = {
            open: () => ui.openModal('modal-pvp'),
            createLink: () => {
                const w = document.getElementById('pvp-input').value.toUpperCase().trim().replace(/[^А-ЯЁ]/g, '');
                if (w.length < 3) { ui.showNotification("От 3 букв (кириллица)!"); return; }
                vkBridge.send('VKWebAppShare', { link: `https://vk.com/app${APP_ID}#pvp=${btoa(unescape(encodeURIComponent(w)))}` }).then(() => ui.closeModal('modal-pvp'));
            },
            start: (word) => { ui.closeAllModals(); game.init('pvp'); isPvp = true; currentWord = word.toUpperCase(); game.setupUI(); }
        };

        const dict = { open: () => { ui.openModal('modal-dict'); document.getElementById('dict-count').textContent = pData.dict.length; document.getElementById('dict-list').innerHTML = pData.dict.length ? pData.dict.map(w => `<div class="drawn-box bg-blue-50 text-blue-900 px-3 py-1 font-bold">${w}</div>`).join('') : '<p class="text-slate-500 w-full text-center mt-10">Тут пока пусто.</p>'; } };

        vk.init();
    </script>
</body>
</html>
